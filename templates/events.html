{% extends "base.html" %}
{% block title %}Stocker — {{ t('events.title') if t is defined else '事件日曆' }}{% endblock %}

{% block content %}
<main class="main-content">
    <div class="container">
        <div class="page-header" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
            <h1 style="font-size:1.3rem; margin:0;" data-i18n="events.title">📅 事件日曆</h1>
            <div style="display:flex; gap:8px; align-items:center;">
                <button class="btn btn-sm" onclick="syncEvents()" id="sync-btn">
                    <span class="material-icons-outlined" style="font-size:18px;">sync</span>
                    <span data-i18n="events.sync">同步</span>
                </button>
            </div>
        </div>

        <!-- Month Navigator -->
        <div class="month-nav" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
            <button class="btn btn-sm" onclick="changeMonth(-1)">
                <span class="material-icons-outlined">chevron_left</span>
            </button>
            <h2 id="month-title" style="font-size:1.1rem; margin:0;"></h2>
            <button class="btn btn-sm" onclick="changeMonth(1)">
                <span class="material-icons-outlined">chevron_right</span>
            </button>
        </div>

        <!-- Calendar Grid -->
        <div id="calendar-grid" class="calendar-grid"></div>

        <!-- Upcoming Events List -->
        <div style="margin-top:24px;">
            <h3 style="font-size:1rem; margin-bottom:12px; color:var(--text-secondary);" data-i18n="events.upcoming">📋 即將到來</h3>

            <!-- v3.4.19: Type filter row — pills + count badge -->
            <div class="events-filter-row">
                <div id="events-type-pills" class="sector-pills events-type-pills">
                    <button class="sector-pill active" data-type="all" onclick="filterEventType('all')">
                        <span data-i18n="events.type.all">全部</span>
                    </button>
                    <button class="sector-pill" data-type="earnings" onclick="filterEventType('earnings')">
                        📊 <span data-i18n="events.type.earnings">盈報</span>
                    </button>
                    <button class="sector-pill" data-type="dividend" onclick="filterEventType('dividend')">
                        💰 <span data-i18n="events.type.dividend">派息</span>
                    </button>
                    <button class="sector-pill" data-type="sec_filing" onclick="filterEventType('sec_filing')">
                        📄 <span data-i18n="events.type.sec_filing">SEC</span>
                    </button>
                </div>
                <span id="events-filter-count" class="events-filter-count"></span>
            </div>

            <div id="upcoming-list"></div>
        </div>
    </div>
</main>

<style>
.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    background: var(--surface-2, #1a1a2e);
    border-radius: 8px;
    overflow: hidden;
}
.cal-header {
    background: var(--surface-3, #252540);
    padding: 8px 4px;
    text-align: center;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted, #888);
}
.cal-day {
    background: var(--surface-1, #16162a);
    min-height: 72px;
    padding: 4px 6px;
    position: relative;
}
.cal-day.other-month {
    opacity: 0.3;
}
.cal-day.today {
    border: 2px solid var(--primary, #4fc3f7);
}
.cal-day-num {
    font-size: 0.75rem;
    color: var(--text-muted, #888);
    margin-bottom: 4px;
}
.cal-day.today .cal-day-num {
    color: var(--primary, #4fc3f7);
    font-weight: 700;
}
.cal-event {
    font-size: 0.65rem;
    padding: 2px 4px;
    border-radius: 4px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
}
.cal-event.earnings {
    background: rgba(255, 193, 7, 0.2);
    color: #ffc107;
    border-left: 3px solid #ffc107;
}
.cal-event.dividend {
    background: rgba(76, 175, 80, 0.2);
    color: #4caf50;
    border-left: 3px solid #4caf50;
}
.cal-event.sec_filing {
    background: rgba(79, 195, 247, 0.2);
    color: #4fc3f7;
    border-left: 3px solid #4fc3f7;
}
.cal-event.other {
    background: rgba(156, 39, 176, 0.2);
    color: #ce93d8;
    border-left: 3px solid #ce93d8;
}
.upcoming-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: var(--surface-1, #16162a);
    border-radius: 8px;
    margin-bottom: 6px;
}
.upcoming-badge {
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 600;
    white-space: nowrap;
}
.upcoming-badge.earnings { background: rgba(255,193,7,0.15); color: #ffc107; }
.upcoming-badge.dividend { background: rgba(76,175,80,0.15); color: #4caf50; }
.upcoming-badge.sec_filing { background: rgba(79,195,247,0.15); color: #4fc3f7; }
.upcoming-badge.other { background: rgba(156,39,176,0.15); color: #ce93d8; }
.upcoming-date {
    font-size: 0.8rem;
    color: var(--text-muted, #888);
    min-width: 70px;
}
.upcoming-title {
    font-size: 0.85rem;
    flex: 1;
}
.empty-state {
    text-align: center;
    padding: 32px;
    color: var(--text-muted, #888);
    font-size: 0.9rem;
}
</style>

<script>
let currentYear, currentMonth;
let allUpcomingEvents = [];   // v3.4.19: cached for client-side filter
let currentEventType = 'all';
const DAYS = t('events.days') || ['日', '一', '二', '三', '四', '五', '六'];

function initCalendar() {
    const now = new Date();
    currentYear = now.getFullYear();
    currentMonth = now.getMonth() + 1;
    loadCalendar();
    loadUpcoming();
}

function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth > 12) { currentMonth = 1; currentYear++; }
    if (currentMonth < 1) { currentMonth = 12; currentYear--; }
    loadCalendar();
}

async function loadCalendar() {
    document.getElementById('month-title').textContent = t('events.year_month', {year: currentYear, month: currentMonth});
    const resp = await fetch(`/api/events/calendar?year=${currentYear}&month=${currentMonth}`);
    const events = await resp.json();

    // Build event map by day
    const eventMap = {};
    events.forEach(e => {
        const day = parseInt(e.event_date.split('-')[2]);
        if (!eventMap[day]) eventMap[day] = [];
        eventMap[day].push(e);
    });

    const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
    const today = new Date();
    const isCurrentMonth = today.getFullYear() === currentYear && today.getMonth() + 1 === currentMonth;

    let html = DAYS.map(d => `<div class="cal-header">${d}</div>`).join('');

    // Empty cells before first day
    for (let i = 0; i < firstDay; i++) {
        html += '<div class="cal-day other-month"></div>';
    }

    for (let d = 1; d <= daysInMonth; d++) {
        const isToday = isCurrentMonth && d === today.getDate();
        const cls = isToday ? 'cal-day today' : 'cal-day';
        let eventsHtml = '';
        if (eventMap[d]) {
            eventsHtml = eventMap[d].slice(0, 3).map(e => {
                const type = e.event_type || 'other';
                return `<div class="cal-event ${type}" title="${e.title}">${e.title}</div>`;
            }).join('');
            if (eventMap[d].length > 3) {
                eventsHtml += `<div class="cal-event other">+${eventMap[d].length - 3} more</div>`;
            }
        }
        html += `<div class="${cls}"><div class="cal-day-num">${d}</div>${eventsHtml}</div>`;
    }

    // Fill remaining cells
    const totalCells = firstDay + daysInMonth;
    const remainder = totalCells % 7;
    if (remainder > 0) {
        for (let i = 0; i < 7 - remainder; i++) {
            html += '<div class="cal-day other-month"></div>';
        }
    }

    document.getElementById('calendar-grid').innerHTML = html;
}

async function loadUpcoming() {
    // v3.4.19: include past 90 days + upcoming window so dividends surface
    const resp = await fetch('/api/events/upcoming?days=365&include_past=true');
    const events = await resp.json();
    allUpcomingEvents = events || [];
    renderUpcoming();
}

function filterEventType(type) {
    currentEventType = type;
    // Update pill active state
    document.querySelectorAll('#events-type-pills .sector-pill').forEach(p => {
        p.classList.toggle('active', p.getAttribute('data-type') === type);
    });
    renderUpcoming();
}

function renderUpcoming() {
    const list = document.getElementById('upcoming-list');
    const countEl = document.getElementById('events-filter-count');

    // Apply type filter
    const filtered = currentEventType === 'all'
        ? allUpcomingEvents
        : allUpcomingEvents.filter(e => (e.event_type || 'other') === currentEventType);

    // Update count badge — show "shown/total" only when filter is active
    if (countEl) {
        if (currentEventType === 'all') {
            countEl.textContent = '';
        } else {
            countEl.textContent = t('events.filter_count', {
                shown: filtered.length,
                total: allUpcomingEvents.length
            });
        }
    }

    if (filtered.length === 0) {
        // Distinguish empty-all vs filtered-out
        const hasAllEvents = allUpcomingEvents.length > 0;
        const icon = hasAllEvents ? 'filter_alt_off' : 'event_busy';
        const title = hasAllEvents
            ? t('events.filtered_empty')
            : t('events.empty');
        const hint = hasAllEvents ? '' : `<br><small>${t('events.empty_hint')}</small>`;
        list.innerHTML = `<div class="empty-state">
            <span class="material-icons-outlined" style="font-size:48px; opacity:0.4;">${icon}</span>
            <div style="margin-top:8px;">${title}</div>
            ${hint}
        </div>`;
        return;
    }

    list.innerHTML = filtered.slice(0, 30).map(e => {
        const type = e.event_type || 'other';
        const dateStr = e.event_date ? e.event_date.substring(5) : '';
        return `<div class="upcoming-item">
            <span class="upcoming-badge ${type}">${type === 'earnings' ? '📊 ' + t('events.type.earnings') : type === 'dividend' ? '💰 ' + t('events.type.dividend') : type === 'sec_filing' ? '📄 ' + t('events.type.sec_filing') : '📌 ' + type}</span>
            <span class="upcoming-date">${dateStr}</span>
            <span class="upcoming-title">${e.title || e.symbol}</span>
            <span style="font-size:0.75rem; color:var(--text-muted);">${e.symbol || ''}</span>
        </div>`;
    }).join('');
}

async function syncEvents() {
    const btn = document.getElementById('sync-btn');
    btn.disabled = true;
    btn.innerHTML = `<span class="material-icons-outlined" style="font-size:18px; animation:spin 1s linear infinite;">sync</span><span>${t('events.syncing')}</span>`;
    try {
        const resp = await fetch('/api/events/sync', { method: 'POST' });
        const data = await resp.json();
        loadCalendar();
        loadUpcoming();
        showToast(t('events.sync_done', {n: data.synced}), 'success');
    } catch (err) {
        showToast(t('events.sync_error') + ': ' + err.message, 'error');
    } finally {
        btn.disabled = false;
        btn.innerHTML = `<span class="material-icons-outlined" style="font-size:18px;">sync</span><span>${t('events.sync')}</span>`;
    }
}

initCalendar();
</script>
{% endblock %}
