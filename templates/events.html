{% extends "base.html" %}
{% block title %}Stocker — 事件日曆{% endblock %}

{% block content %}
<main class="main-content">
    <div class="container">
        <div class="page-header" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
            <h1 style="font-size:1.3rem; margin:0;">📅 事件日曆</h1>
            <div style="display:flex; gap:8px; align-items:center;">
                <button class="btn btn-sm" onclick="syncEvents()" id="sync-btn">
                    <span class="material-icons-outlined" style="font-size:18px;">sync</span>
                    <span>同步</span>
                </button>
            </div>
        </div>

        <!-- Month Navigator -->
        <div class="month-nav" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
            <button class="btn btn-sm" onclick="changeMonth(-1)">
                <span class="material-icons-outlined">chevron_left</span>
            </button>
            <h2 id="month-title" style="font-size:1.1rem; margin:0;"></h2>
            <button class="btn btn-sm" onclick="changeMonth(1)">
                <span class="material-icons-outlined">chevron_right</span>
            </button>
        </div>

        <!-- Calendar Grid -->
        <div id="calendar-grid" class="calendar-grid"></div>

        <!-- Upcoming Events List -->
        <div style="margin-top:24px;">
            <h3 style="font-size:1rem; margin-bottom:12px; color:var(--text-secondary);">📋 即將到來</h3>
            <div id="upcoming-list"></div>
        </div>
    </div>
</main>

<style>
.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    background: var(--surface-2, #1a1a2e);
    border-radius: 8px;
    overflow: hidden;
}
.cal-header {
    background: var(--surface-3, #252540);
    padding: 8px 4px;
    text-align: center;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted, #888);
}
.cal-day {
    background: var(--surface-1, #16162a);
    min-height: 72px;
    padding: 4px 6px;
    position: relative;
}
.cal-day.other-month {
    opacity: 0.3;
}
.cal-day.today {
    border: 2px solid var(--primary, #4fc3f7);
}
.cal-day-num {
    font-size: 0.75rem;
    color: var(--text-muted, #888);
    margin-bottom: 4px;
}
.cal-day.today .cal-day-num {
    color: var(--primary, #4fc3f7);
    font-weight: 700;
}
.cal-event {
    font-size: 0.65rem;
    padding: 2px 4px;
    border-radius: 4px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
}
.cal-event.earnings {
    background: rgba(255, 193, 7, 0.2);
    color: #ffc107;
    border-left: 3px solid #ffc107;
}
.cal-event.dividend {
    background: rgba(76, 175, 80, 0.2);
    color: #4caf50;
    border-left: 3px solid #4caf50;
}
.cal-event.sec_filing {
    background: rgba(79, 195, 247, 0.2);
    color: #4fc3f7;
    border-left: 3px solid #4fc3f7;
}
.cal-event.other {
    background: rgba(156, 39, 176, 0.2);
    color: #ce93d8;
    border-left: 3px solid #ce93d8;
}
.upcoming-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: var(--surface-1, #16162a);
    border-radius: 8px;
    margin-bottom: 6px;
}
.upcoming-badge {
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 600;
    white-space: nowrap;
}
.upcoming-badge.earnings { background: rgba(255,193,7,0.15); color: #ffc107; }
.upcoming-badge.dividend { background: rgba(76,175,80,0.15); color: #4caf50; }
.upcoming-badge.sec_filing { background: rgba(79,195,247,0.15); color: #4fc3f7; }
.upcoming-badge.other { background: rgba(156,39,176,0.15); color: #ce93d8; }
.upcoming-date {
    font-size: 0.8rem;
    color: var(--text-muted, #888);
    min-width: 70px;
}
.upcoming-title {
    font-size: 0.85rem;
    flex: 1;
}
.empty-state {
    text-align: center;
    padding: 32px;
    color: var(--text-muted, #888);
    font-size: 0.9rem;
}
</style>

<script>
let currentYear, currentMonth;
const DAYS = ['日', '一', '二', '三', '四', '五', '六'];

function initCalendar() {
    const now = new Date();
    currentYear = now.getFullYear();
    currentMonth = now.getMonth() + 1;
    loadCalendar();
    loadUpcoming();
}

function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth > 12) { currentMonth = 1; currentYear++; }
    if (currentMonth < 1) { currentMonth = 12; currentYear--; }
    loadCalendar();
}

async function loadCalendar() {
    document.getElementById('month-title').textContent = `${currentYear} 年 ${currentMonth} 月`;
    const resp = await fetch(`/api/events/calendar?year=${currentYear}&month=${currentMonth}`);
    const events = await resp.json();

    // Build event map by day
    const eventMap = {};
    events.forEach(e => {
        const day = parseInt(e.event_date.split('-')[2]);
        if (!eventMap[day]) eventMap[day] = [];
        eventMap[day].push(e);
    });

    const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
    const today = new Date();
    const isCurrentMonth = today.getFullYear() === currentYear && today.getMonth() + 1 === currentMonth;

    let html = DAYS.map(d => `<div class="cal-header">${d}</div>`).join('');

    // Empty cells before first day
    for (let i = 0; i < firstDay; i++) {
        html += '<div class="cal-day other-month"></div>';
    }

    for (let d = 1; d <= daysInMonth; d++) {
        const isToday = isCurrentMonth && d === today.getDate();
        const cls = isToday ? 'cal-day today' : 'cal-day';
        let eventsHtml = '';
        if (eventMap[d]) {
            eventsHtml = eventMap[d].slice(0, 3).map(e => {
                const type = e.event_type || 'other';
                return `<div class="cal-event ${type}" title="${e.title}">${e.title}</div>`;
            }).join('');
            if (eventMap[d].length > 3) {
                eventsHtml += `<div class="cal-event other">+${eventMap[d].length - 3} more</div>`;
            }
        }
        html += `<div class="${cls}"><div class="cal-day-num">${d}</div>${eventsHtml}</div>`;
    }

    // Fill remaining cells
    const totalCells = firstDay + daysInMonth;
    const remainder = totalCells % 7;
    if (remainder > 0) {
        for (let i = 0; i < 7 - remainder; i++) {
            html += '<div class="cal-day other-month"></div>';
        }
    }

    document.getElementById('calendar-grid').innerHTML = html;
}

async function loadUpcoming() {
    const resp = await fetch('/api/events/upcoming?days=90');
    const events = await resp.json();
    const list = document.getElementById('upcoming-list');

    if (events.length === 0) {
        list.innerHTML = '<div class="empty-state">暫無即將到來嘅事件<br><small>點擊「同步」從 Yahoo Finance 獲取</small></div>';
        return;
    }

    list.innerHTML = events.slice(0, 20).map(e => {
        const type = e.event_type || 'other';
        const dateStr = e.event_date ? e.event_date.substring(5) : '';
        return `<div class="upcoming-item">
            <span class="upcoming-badge ${type}">${type === 'earnings' ? '📊 盈報' : type === 'dividend' ? '💰 派息' : type === 'sec_filing' ? '📄 SEC' : '📌 ' + type}</span>
            <span class="upcoming-date">${dateStr}</span>
            <span class="upcoming-title">${e.title || e.symbol}</span>
            <span style="font-size:0.75rem; color:var(--text-muted);">${e.symbol || ''}</span>
        </div>`;
    }).join('');
}

async function syncEvents() {
    const btn = document.getElementById('sync-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="material-icons-outlined" style="font-size:18px; animation:spin 1s linear infinite;">sync</span><span>同步中...</span>';
    try {
        const resp = await fetch('/api/events/sync', { method: 'POST' });
        const data = await resp.json();
        loadCalendar();
        loadUpcoming();
        showToast(`已同步 ${data.synced} 個事件`, 'success');
    } catch (err) {
        showToast('同步失敗: ' + err.message, 'error');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<span class="material-icons-outlined" style="font-size:18px;">sync</span><span>同步</span>';
    }
}

initCalendar();
</script>
{% endblock %}
