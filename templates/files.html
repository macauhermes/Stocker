{% extends "base.html" %}
{% block title %}Stocker — 檔案{% endblock %}
{% block page_title_key %}files.title{% endblock %}

{% block content %}
<!-- Page Header -->
<div style="display:flex; align-items:center; margin-bottom:16px;">
    <h1 style="font-size:1.3rem; font-weight:600; display:flex; align-items:center; gap:8px;">
        <span class="material-icons-outlined">folder</span>
        <span data-i18n="files.title">檔案管理</span>
    </h1>
</div>

<!-- Category Filter Tabs -->
<div class="tabs" style="margin-bottom:16px;">
    <button class="tab-btn active" data-category="all" onclick="filterByCategory('all')">
        <span class="material-icons-outlined">apps</span>
        <span data-i18n="files.cat.all">全部</span>
    </button>
    <button class="tab-btn" data-category="earnings" onclick="filterByCategory('earnings')">
        <span class="material-icons-outlined">assessment</span>
        <span data-i18n="files.cat.earnings">財報</span>
    </button>
    <button class="tab-btn" data-category="analyst_report" onclick="filterByCategory('analyst_report')">
        <span class="material-icons-outlined">analytics</span>
        <span data-i18n="files.cat.analyst_report">分析</span>
    </button>
    <button class="tab-btn" data-category="sec_filing" onclick="filterByCategory('sec_filing')">
        <span class="material-icons-outlined">description</span>
        <span data-i18n="files.cat.sec_filing">SEC 文件</span>
    </button>
</div>

<!-- v3.4.23: filter row — ticker pills + search input + sort dropdown + count badge.
     Hidden until first data load via initFilesFilterRow(). Reuses .events-filter-row
     + .sector-pills + .stocks-control-select from v3.4.14/19/22. -->
<div id="files-filter-row" class="events-filter-row" style="display:none;">
    <div id="files-ticker-pills" class="sector-pills events-type-pills files-ticker-pills"></div>
    <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
        <input type="text" id="files-search-input" class="input files-search-input"
               data-i18n-placeholder="files.search_placeholder"
               placeholder="搜尋檔名..." />
        <select id="files-sort-select" class="stocks-control-select">
            <option value="newest" data-i18n="files.sort_newest">最新優先</option>
            <option value="oldest" data-i18n="files.sort_oldest">最早優先</option>
            <option value="name" data-i18n="files.sort_name">檔名排序</option>
            <option value="size_desc" data-i18n="files.sort_size_desc">檔案最大</option>
        </select>
        <span id="files-filter-count" class="events-filter-count"></span>
    </div>
</div>

<!-- File List -->
<div id="file-list" class="file-list">
    <div class="loading-cell">
        <div class="spinner-sm"></div>
        <span data-i18n="common.loading">載入中...</span>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let allFiles = [];
    let activeCategory = 'all';
    // v3.4.23 — filter row state (ticker pills + search + sort + count)
    let activeTicker = 'all';
    let searchQuery = '';
    let sortMode = 'newest';

    function filterByCategory(category) {
        activeCategory = category;
        document.querySelectorAll('[data-category]').forEach(b => {
            b.classList.toggle('active', b.dataset.category === category);
        });
        renderFiles();
    }

    // v3.4.23 — Build ticker pills dynamically from data (sorted by count desc)
    function buildFilesFilterRow() {
        const pillsContainer = document.getElementById('files-ticker-pills');
        const filterRow = document.getElementById('files-filter-row');
        if (!allFiles || allFiles.length === 0) {
            filterRow.style.display = 'none';
            return;
        }
        filterRow.style.display = 'flex';

        // Count by ticker (parsed from filename prefix, e.g. "TSLA_10-K_...")
        const counts = { all: allFiles.length };
        allFiles.forEach(f => {
            const fname = f.filename || '';
            const sym = fname.split('_')[0].toUpperCase();
            if (sym && /^[A-Z]{1,5}$/.test(sym)) {
                counts[sym] = (counts[sym] || 0) + 1;
            }
        });

        // Tickers sorted by count desc
        const tickers = Object.entries(counts)
            .filter(([k]) => k !== 'all')
            .sort((a, b) => b[1] - a[1])
            .map(([k]) => k);

        // Build pills: all + tickers
        const allPill = `<button class="sector-pill ${activeTicker === 'all' ? 'active' : ''}" data-ticker="all">
            ${t('common.all')} <span style="opacity:.6; margin-left:4px;">${counts.all}</span>
        </button>`;
        const tickerPills = tickers.map(tk =>
            `<button class="sector-pill ${activeTicker === tk ? 'active' : ''}" data-ticker="${escHtml(tk)}">
                ${escHtml(tk)} <span style="opacity:.6; margin-left:4px;">${counts[tk]}</span>
            </button>`
        ).join('');

        pillsContainer.innerHTML = allPill + tickerPills;
    }

    // v3.4.23 — Apply ticker + category + search + sort + render
    function renderFiles() {
        const container = document.getElementById('file-list');
        const countBadge = document.getElementById('files-filter-count');
        if (!allFiles || allFiles.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <span class="material-icons-outlined empty-state-icon">folder_open</span>
                    <div class="empty-state-title">${t('files.empty')}</div>
                </div>
            `;
            countBadge.textContent = '';
            return;
        }

        // 1. Category filter (existing)
        let filtered = activeCategory === 'all'
            ? allFiles.slice()
            : allFiles.filter(f => f.category === activeCategory);

        // 2. Ticker pill filter
        if (activeTicker !== 'all') {
            filtered = filtered.filter(f => {
                const sym = (f.filename || '').split('_')[0].toUpperCase();
                return sym === activeTicker;
            });
        }

        // 3. Search query (filename case-insensitive substring)
        const q = searchQuery.trim().toLowerCase();
        if (q) {
            filtered = filtered.filter(f => (f.filename || '').toLowerCase().includes(q));
        }

        // 4. Sort
        filtered.sort((a, b) => {
            switch (sortMode) {
                case 'newest':
                    return (new Date(b.created_at || 0).getTime()) - (new Date(a.created_at || 0).getTime());
                case 'oldest':
                    return (new Date(a.created_at || 0).getTime()) - (new Date(b.created_at || 0).getTime());
                case 'name':
                    return (a.filename || '').localeCompare(b.filename || '');
                case 'size_desc':
                    return (b.file_size || 0) - (a.file_size || 0);
                default:
                    return 0;
            }
        });

        // Count badge — distinguish "filter excluded all" vs "no data"
        const filterActive = activeTicker !== 'all' || q || activeCategory !== 'all';
        if (filterActive) {
            countBadge.textContent = t('files.count_filtered', { shown: filtered.length, total: allFiles.length });
        } else {
            countBadge.textContent = t('files.count_total', { total: allFiles.length });
        }

        if (!filtered || filtered.length === 0) {
            const isFiltered = filterActive;
            container.innerHTML = `
                <div class="empty-state">
                    <span class="material-icons-outlined empty-state-icon">${isFiltered ? 'filter_alt_off' : 'folder_open'}</span>
                    <div class="empty-state-title">${isFiltered ? t('files.no_filter_match') : t('files.empty')}</div>
                    ${isFiltered ? `<div class="empty-state-text">${t('files.try_other_filter')}</div>` : ''}
                </div>
            `;
            return;
        }

        container.innerHTML = '';
        filtered.forEach(f => {
            const date = f.created_at ? formatDate(f.created_at) : '—';
            const size = formatFileSize(f.file_size);
            const categoryLabel = formatCategory(f.category);
            
            // Determine icon and color based on category
            let icon = 'description';
            let iconBg = 'rgba(73, 79, 223, 0.15)';
            let iconColor = 'var(--blue)';
            
            if (f.category === 'earnings') {
                icon = 'assessment';
                iconBg = 'rgba(0, 200, 83, 0.15)';
                iconColor = 'var(--green)';
            } else if (f.category === 'analyst_report') {
                icon = 'analytics';
                iconBg = 'rgba(73, 79, 223, 0.15)';
                iconColor = 'var(--blue)';
            } else if (f.category === 'sec_filing') {
                icon = 'gavel';
                iconBg = 'rgba(255, 145, 0, 0.15)';
                iconColor = 'var(--orange, #ff9100)';
            }

            const item = document.createElement('div');
            item.className = 'file-item';
            item.innerHTML = `
                <div class="file-icon" style="background:${iconBg}">
                    <span class="material-icons-outlined" style="color:${iconColor}">${icon}</span>
                </div>
                <div class="file-info">
                    <div class="file-name">${f.filename || '—'}</div>
                    <div class="file-meta">
                        <span class="badge" style="background:${iconBg}; color:${iconColor}; font-size:0.7rem;">${categoryLabel}</span>
                        <span>${size}</span>
                        <span>${date}</span>
                    </div>
                </div>
                <div class="file-actions">
                    ${f.report_id ? `
                    <a href="/report/${f.report_id}" class="file-view" data-i18n-title="files.view_report" title="查看報告">
                        <span class="material-icons-outlined">description</span>
                    </a>` : ''}
                    <a href="/api/files/${f.id}/download" class="file-download" data-i18n-title="files.download" title="下載" download>
                        <span class="material-icons-outlined">download</span>
                    </a>
                </div>
            `;
            container.appendChild(item);
        });
    }

    function formatFileSize(bytes) {
        if (bytes == null || bytes === 0) return '0 B';
        const units = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(1024));
        return (bytes / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
    }

    function formatCategory(cat) {
        const map = {
            'earnings': t('files.cat.earnings'),
            'analyst_report': t('files.cat.analyst_report'),
            'news': t('files.cat.news'),
            'sec_filing': t('files.cat.sec_filing')
        };
        return map[cat] || cat || '—';
    }

    // v3.4.23 — HTML escape helper (mirrors index.html)
    function escHtml(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // Load files
    async function loadFiles() {
        try {
            const res = await fetch('/api/files');
            if (!res.ok) throw new Error('Failed to fetch files');
            allFiles = await res.json();
            buildFilesFilterRow();
            renderFiles();
        } catch (err) {
            console.error(err);
            document.getElementById('file-list').innerHTML = `
                <div class="empty-state">
                    <span class="material-icons-outlined empty-state-icon">error</span>
                    <div class="empty-state-title">${t('files.load_error')}</div>
                </div>
            `;
        }
    }

    // v3.4.23 — Wire up filter row event listeners (search debounce, pill click, sort change)
    function initFilesFilterRow() {
        // Ticker pill click (event delegation — pills are re-rendered each filter change)
        const pillsContainer = document.getElementById('files-ticker-pills');
        if (pillsContainer) {
            pillsContainer.addEventListener('click', (e) => {
                const pill = e.target.closest('.sector-pill');
                if (!pill) return;
                activeTicker = pill.dataset.ticker;
                pillsContainer.querySelectorAll('.sector-pill').forEach(p => {
                    p.classList.toggle('active', p.dataset.ticker === activeTicker);
                });
                renderFiles();
            });
        }

        // Sort dropdown
        const sortSelect = document.getElementById('files-sort-select');
        if (sortSelect) {
            sortSelect.addEventListener('change', (e) => {
                sortMode = e.target.value;
                renderFiles();
            });
        }

        // Search input — 200ms debounce
        const searchInput = document.getElementById('files-search-input');
        if (searchInput) {
            let _debounceTimer = null;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(_debounceTimer);
                _debounceTimer = setTimeout(() => {
                    searchQuery = e.target.value;
                    renderFiles();
                }, 200);
            });
        }
    }

    // Init
    loadFiles();
    initFilesFilterRow();

    // Reload on language change (re-render pill labels + sort options + count)
    window.addEventListener('langchange', () => {
        buildFilesFilterRow();
        renderFiles();
    });
</script>
{% endblock %}
