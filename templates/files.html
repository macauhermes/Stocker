{% extends "base.html" %}
{% block title %}檔案 — Stocker{% endblock %}

{% block content %}
<!-- Page Header -->
<div style="display:flex; align-items:center; margin-bottom:16px;">
    <h1 style="font-size:1.3rem; font-weight:600; display:flex; align-items:center; gap:8px;">
        <span class="material-icons-outlined">folder</span>
        <span data-i18n="files.title">檔案管理</span>
    </h1>
</div>

<!-- Category Filter Tabs -->
<div class="tabs" style="margin-bottom:16px;">
    <button class="tab-btn active" data-category="all" onclick="filterByCategory('all')">
        <span class="material-icons-outlined">apps</span>
        <span data-i18n="files.cat.all">全部</span>
    </button>
    <button class="tab-btn" data-category="earnings" onclick="filterByCategory('earnings')">
        <span class="material-icons-outlined">assessment</span>
        <span data-i18n="files.cat.earnings">財報</span>
    </button>
    <button class="tab-btn" data-category="analyst_report" onclick="filterByCategory('analyst_report')">
        <span class="material-icons-outlined">analytics</span>
        <span data-i18n="files.cat.analyst_report">分析</span>
    </button>
    <button class="tab-btn" data-category="news" onclick="filterByCategory('news')">
        <span class="material-icons-outlined">article</span>
        <span data-i18n="files.cat.news">新聞</span>
    </button>
</div>

<!-- File List -->
<div id="file-list" class="file-list">
    <div class="loading-cell">
        <div class="spinner-sm"></div>
        <span data-i18n="common.loading">載入中...</span>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let allFiles = [];
    let activeCategory = 'all';

    function filterByCategory(category) {
        activeCategory = category;
        document.querySelectorAll('[data-category]').forEach(b => {
            b.classList.toggle('active', b.dataset.category === category);
        });
        renderFiles();
    }

    // Load files
    async function loadFiles() {
        try {
            const res = await fetch('/api/files');
            if (!res.ok) throw new Error('Failed to fetch files');
            allFiles = await res.json();
            renderFiles();
        } catch (err) {
            console.error(err);
            document.getElementById('file-list').innerHTML = `
                <div class="empty-state">
                    <span class="material-icons-outlined empty-state-icon">error</span>
                    <div class="empty-state-title">${t('files.load_error')}</div>
                </div>
            `;
        }
    }

    function renderFiles() {
        const container = document.getElementById('file-list');
        const filtered = activeCategory === 'all'
            ? allFiles
            : allFiles.filter(f => f.category === activeCategory);

        if (!filtered || filtered.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <span class="material-icons-outlined empty-state-icon">folder_open</span>
                    <div class="empty-state-title">${t('files.empty')}</div>
                </div>
            `;
            return;
        }

        container.innerHTML = '';
        filtered.forEach(f => {
            const date = f.created_at ? new Date(f.created_at).toLocaleDateString('zh-TW') : '—';
            const size = formatFileSize(f.file_size);
            const categoryLabel = formatCategory(f.category);
            
            // Determine icon and color based on category
            let icon = 'description';
            let iconBg = 'rgba(73, 79, 223, 0.15)';
            let iconColor = 'var(--blue)';
            
            if (f.category === 'earnings') {
                icon = 'assessment';
                iconBg = 'rgba(0, 200, 83, 0.15)';
                iconColor = 'var(--green)';
            } else if (f.category === 'news') {
                icon = 'article';
                iconBg = 'rgba(255, 214, 0, 0.15)';
                iconColor = 'var(--yellow)';
            } else if (f.category === 'analyst_report') {
                icon = 'analytics';
                iconBg = 'rgba(73, 79, 223, 0.15)';
                iconColor = 'var(--blue)';
            }

            const item = document.createElement('div');
            item.className = 'file-item';
            item.innerHTML = `
                <div class="file-icon" style="background:${iconBg}">
                    <span class="material-icons-outlined" style="color:${iconColor}">${icon}</span>
                </div>
                <div class="file-info">
                    <div class="file-name">${f.filename || '—'}</div>
                    <div class="file-meta">
                        <span class="badge" style="background:${iconBg}; color:${iconColor}; font-size:0.7rem;">${categoryLabel}</span>
                        <span>${size}</span>
                        <span>${date}</span>
                    </div>
                </div>
                <a href="/api/files/${f.id}/download" class="file-download" download>
                    <span class="material-icons-outlined">download</span>
                </a>
            `;
            container.appendChild(item);
        });
    }

    function formatFileSize(bytes) {
        if (bytes == null || bytes === 0) return '0 B';
        const units = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(1024));
        return (bytes / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
    }

    function formatCategory(cat) {
        const map = {
            'earnings': t('files.cat.earnings'),
            'analyst_report': t('files.cat.analyst_report'),
            'news': t('files.cat.news'),
            'sec_filing': t('files.cat.sec_filing')
        };
        return map[cat] || cat || '—';
    }

    // Init
    loadFiles();

    // Reload on language change
    window.addEventListener('langchange', () => loadFiles());
</script>
{% endblock %}
