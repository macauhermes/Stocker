{% extends "base.html" %}
{% block title %}行業 — Stocker{% endblock %}

{% block content %}
<!-- Page Header -->
<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
    <h1 style="font-size:1.3rem; font-weight:600; display:flex; align-items:center; gap:8px;">
        <span class="material-icons-outlined">business</span>
        <span data-i18n="industry.title">行業新聞與報告</span>
    </h1>
    <button class="btn btn-primary btn-sm" id="btn-collect" onclick="collectNews()">
        <span class="material-icons-outlined" style="font-size:18px">refresh</span>
        <span id="collect-label" data-i18n="industry.collect">收集</span>
    </button>
</div>

<!-- Sector Grid -->
<div id="sectors-grid" class="industry-grid">
    <div class="loading-cell">
        <div class="spinner-sm"></div>
        <span data-i18n="common.loading">載入中...</span>
    </div>
</div>

<!-- Reports Panel (shown when a sector is selected) -->
<div id="reports-panel" style="display:none; margin-top:16px;">
    <div class="card">
        <div class="card-header">
            <div class="card-title">
                <span class="material-icons-outlined">description</span>
                <span id="reports-title"></span>
            </div>
            <button class="btn btn-ghost btn-icon" onclick="closeReports()">
                <span class="material-icons-outlined">close</span>
            </button>
        </div>
        <div id="reports-list" class="report-list"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let allSectors = [];
    let activeSector = null;

    // Load sector data
    document.addEventListener('DOMContentLoaded', loadSectors);

    // Reload on language change
    document.addEventListener('langchange', () => {
        loadSectors();
        if (activeSector) selectSector(activeSector);
    });

    async function loadSectors() {
        try {
            const res = await fetch('/api/industry/data');
            const data = await res.json();
            allSectors = data.sectors || [];
            renderSectors();
        } catch (e) {
            console.error('Failed to load sectors:', e);
            document.getElementById('sectors-grid').innerHTML = `
                <div class="empty-state">
                    <span class="material-icons-outlined empty-state-icon">error</span>
                    <div class="empty-state-title">${t('industry.load_error')}</div>
                </div>
            `;
        }
    }

    function renderSectors() {
        const grid = document.getElementById('sectors-grid');
        if (!allSectors.length) {
            grid.innerHTML = `
                <div class="empty-state">
                    <span class="material-icons-outlined empty-state-icon">business</span>
                    <div class="empty-state-title">${t('industry.no_sectors')}</div>
                </div>
            `;
            return;
        }
        
        grid.innerHTML = allSectors.map(s => `
            <div class="industry-card ${activeSector === s.name ? 'active' : ''}"
                 onclick="selectSector('${escHtml(s.name)}')">
                <div class="industry-card-icon">
                    <span class="material-icons-outlined">${getSectorIcon(s.name)}</span>
                </div>
                <div>
                    <div class="industry-card-name" title="${escHtml(s.name)}">${escHtml(s.name)}</div>
                    <div class="industry-card-stats">
                        ${s.ticker_count} ${t('industry.tickers')} · ${s.report_count} ${t('industry.reports')}
                    </div>
                </div>
            </div>
        `).join('');
    }

    function getSectorIcon(sector) {
        const icons = {
            'Technology': 'memory',
            'Consumer Cyclical': 'shopping_cart',
            'Industrials': 'factory',
            'Healthcare': 'local_hospital',
            'Financial': 'account_balance',
            'Energy': 'bolt',
            'Communication': 'cell_tower',
            'Real Estate': 'home',
            'Utilities': 'power',
            'Basic Materials': 'science',
        };
        return icons[sector] || 'business';
    }

    // Select a sector → load its reports
    async function selectSector(sectorName) {
        activeSector = sectorName;
        renderSectors();

        const panel = document.getElementById('reports-panel');
        const title = document.getElementById('reports-title');
        const list = document.getElementById('reports-list');

        title.textContent = sectorName + ' — ' + t('industry.reports');
        list.innerHTML = `
            <div class="loading-cell">
                <div class="spinner-sm"></div>
                <span>${t('common.loading')}</span>
            </div>
        `;
        panel.style.display = 'block';
        panel.scrollIntoView({ behavior: 'smooth', block: 'start' });

        try {
            const res = await fetch('/api/sectors/' + encodeURIComponent(sectorName) + '/reports');
            const reports = await res.json();
            renderReports(reports);
        } catch (e) {
            console.error('Failed to load reports:', e);
            list.innerHTML = `
                <div class="empty-state">
                    <span class="material-icons-outlined empty-state-icon">error</span>
                    <div class="empty-state-title">${t('industry.report_error')}</div>
                </div>
            `;
        }
    }

    function renderReports(reports) {
        const list = document.getElementById('reports-list');
        if (!reports.length) {
            list.innerHTML = `
                <div class="empty-state">
                    <span class="material-icons-outlined empty-state-icon">description</span>
                    <div class="empty-state-title">${t('industry.no_reports')}</div>
                </div>
            `;
            return;
        }

        list.innerHTML = reports.map(r => {
            const summary = (r.summary || r.title || '').substring(0, 80);
            const source = r.source || '—';
            const date = r.published_at || r.created_at || '';
            const dateStr = date ? new Date(date).toLocaleDateString('zh-TW') : '—';
            
            // Determine icon based on category
            let icon = 'description';
            let iconBg = 'rgba(73, 79, 223, 0.15)';
            let iconColor = 'var(--blue)';
            
            if (r.category === 'earnings') {
                icon = 'assessment';
                iconBg = 'rgba(0, 200, 83, 0.15)';
                iconColor = 'var(--green)';
            } else if (r.category === 'industry' || r.category === 'news') {
                icon = 'article';
                iconBg = 'rgba(255, 214, 0, 0.15)';
                iconColor = 'var(--yellow)';
            }

            return `
                <a href="/report/${r.id}" class="report-card">
                    <div class="report-card-header">
                        <div class="report-icon" style="background:${iconBg}">
                            <span class="material-icons-outlined" style="color:${iconColor}">${icon}</span>
                        </div>
                        <div style="flex:1; min-width:0;">
                            <div class="report-title">${escHtml(r.title || 'Untitled')}</div>
                            <div class="report-summary">${escHtml(summary)}${summary.length >= 80 ? '...' : ''}</div>
                        </div>
                    </div>
                    <div class="report-meta">
                        <span class="report-source">
                            <span class="material-icons-outlined" style="font-size:14px">source</span>
                            ${escHtml(source)}
                        </span>
                        <span class="report-date">
                            <span class="material-icons-outlined" style="font-size:14px">schedule</span>
                            ${dateStr}
                        </span>
                    </div>
                </a>
            `;
        }).join('');
    }

    function closeReports() {
        activeSector = null;
        document.getElementById('reports-panel').style.display = 'none';
        renderSectors();
    }

    // Collect news
    async function collectNews() {
        const btn = document.getElementById('btn-collect');
        const label = document.getElementById('collect-label');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner-sm"></div> ' + t('industry.collecting');

        try {
            const res = await fetch('/api/reports/collect', { method: 'POST' });
            const data = await res.json();
            if (res.ok) {
                showToast('收集完成！', 'success');
                loadSectors();
                if (activeSector) selectSector(activeSector);
            } else {
                showToast(data.error || '收集失敗', 'error');
            }
        } catch (e) {
            showToast('網絡錯誤', 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = `
                <span class="material-icons-outlined" style="font-size:18px">refresh</span>
                <span>${t('industry.collect')}</span>
            `;
        }
    }

    // Helpers
    function escHtml(str) {
        const d = document.createElement('div');
        d.textContent = str || '';
        return d.innerHTML;
    }
</script>
{% endblock %}
