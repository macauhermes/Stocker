{% extends "base.html" %}
{% block title %}行業 — Stocker{% endblock %}

{% block content %}
<!-- Page Header -->
<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
    <h1 style="font-size:1.3rem; font-weight:600; display:flex; align-items:center; gap:8px;">
        <span class="material-icons-outlined">business</span>
        <span data-i18n="industry.title">行業新聞與報告</span>
    </h1>
    <button class="btn btn-primary btn-sm" id="btn-collect" onclick="collectNews()">
        <span class="material-icons-outlined" style="font-size:18px">refresh</span>
        <span id="collect-label" data-i18n="industry.collect">收集</span>
    </button>
</div>

<!-- Sector Grid -->
<div id="sectors-grid" class="industry-grid">
    <div class="loading-cell">
        <div class="spinner-sm"></div>
        <span data-i18n="common.loading">載入中...</span>
    </div>
</div>

<!-- Reports Panel (shown when a sector is selected) -->
<div id="reports-panel" style="display:none; margin-top:16px;">
    <!-- Industry News section (v3.4.16) — dedicated panel for category='industry'
         rows from /api/industry/<sector>/news. Visually separate from the
         broader sector reports below so users can distinguish nightly-collected
         industry news from per-ticker earnings / analyst / SEC filings. -->
    <div class="card" style="margin-bottom:16px;">
        <div class="card-header">
            <div class="card-title">
                <span class="material-icons-outlined" style="color:var(--yellow)">article</span>
                <span id="news-title"></span>
            </div>
            <span id="news-count" class="card-meta"></span>
        </div>
        <div id="news-list" class="report-list"></div>
    </div>

    <!-- Sector Reports (existing) — earnings / analyst reports / SEC filings
         that mention any ticker in this sector. Broader than industry news.
         v3.4.22: added category filter row + sort dropdown + count badge. -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">
                <span class="material-icons-outlined">description</span>
                <span id="reports-title"></span>
            </div>
            <button class="btn btn-ghost btn-icon" onclick="closeReports()">
                <span class="material-icons-outlined">close</span>
            </button>
        </div>
        <!-- Filter row (v3.4.22) — category pills + sort dropdown + count badge.
             Hidden until first data load via initReportsFilterRow() -->
        <div id="reports-filter-row" class="events-filter-row" style="display:none;">
            <div id="reports-category-pills" class="sector-pills events-type-pills industry-reports-pills"></div>
            <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
                <select id="reports-sort-select" class="stocks-control-select">
                    <option value="desc" data-i18n="industry.sort_newest">最新優先</option>
                    <option value="asc" data-i18n="industry.sort_oldest">最早優先</option>
                </select>
                <span id="reports-filter-count" class="events-filter-count"></span>
            </div>
        </div>
        <div id="reports-list" class="report-list"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let allSectors = [];
    let activeSector = null;

    // v3.4.22 — Sector reports filter state (module-scoped cache + filter)
    let allSectorReports = [];     // raw reports for active sector
    let reportsFilter = 'all';     // 'all' | 'earnings' | 'analyst_report' | 'sec_filing'
    let reportsSort = 'desc';      // 'desc' (newest first) | 'asc' (oldest first)

    // Load sector data
    document.addEventListener('DOMContentLoaded', loadSectors);

    // Reload on language change
    document.addEventListener('langchange', () => {
        loadSectors();
        if (activeSector) selectSector(activeSector);
    });

    // v3.4.22 — Filter row event listeners (set up once at page load)
    document.addEventListener('DOMContentLoaded', () => {
        const select = document.getElementById('reports-sort-select');
        if (select) {
            select.addEventListener('change', (e) => {
                reportsSort = e.target.value;
                renderSectorReports();
            });
        }
        // Pills use event delegation (rebuilt each render)
        const pillsContainer = document.getElementById('reports-category-pills');
        if (pillsContainer) {
            pillsContainer.addEventListener('click', (e) => {
                const pill = e.target.closest('.sector-pill');
                if (!pill) return;
                reportsFilter = pill.dataset.category;
                // Update active state
                pillsContainer.querySelectorAll('.sector-pill').forEach(p => {
                    p.classList.toggle('active', p.dataset.category === reportsFilter);
                });
                renderSectorReports();
            });
        }
    });

    async function loadSectors() {
        try {
            const res = await fetch('/api/industry/data');
            const data = await res.json();
            allSectors = data.sectors || [];
            renderSectors();
        } catch (e) {
            console.error('Failed to load sectors:', e);
            document.getElementById('sectors-grid').innerHTML = `
                <div class="empty-state">
                    <span class="material-icons-outlined empty-state-icon">error</span>
                    <div class="empty-state-title">${t('industry.load_error')}</div>
                </div>
            `;
        }
    }

    function renderSectors() {
        const grid = document.getElementById('sectors-grid');
        if (!allSectors.length) {
            grid.innerHTML = `
                <div class="empty-state">
                    <span class="material-icons-outlined empty-state-icon">business</span>
                    <div class="empty-state-title">${t('industry.no_sectors')}</div>
                </div>
            `;
            return;
        }
        
        grid.innerHTML = allSectors.map(s => `
            <div class="industry-card ${activeSector === s.name ? 'active' : ''}"
                 onclick="selectSector('${escHtml(s.name)}')">
                <div class="industry-card-icon">
                    <span class="material-icons-outlined">${getSectorIcon(s.name)}</span>
                </div>
                <div>
                    <div class="industry-card-name" title="${escHtml(s.name)}">${escHtml(s.name)}</div>
                    <div class="industry-card-stats">
                        ${s.ticker_count} ${t('industry.tickers')} · ${s.report_count} ${t('industry.reports')}
                    </div>
                </div>
            </div>
        `).join('');
    }

    function getSectorIcon(sector) {
        const icons = {
            'Technology': 'memory',
            'Consumer Cyclical': 'shopping_cart',
            'Industrials': 'factory',
            'Healthcare': 'local_hospital',
            'Financial': 'account_balance',
            'Energy': 'bolt',
            'Communication': 'cell_tower',
            'Real Estate': 'home',
            'Utilities': 'power',
            'Basic Materials': 'science',
        };
        return icons[sector] || 'business';
    }

    // Select a sector → load its news + reports in parallel
    // (v3.4.16: news comes from /api/industry/<sector>/news, reports from
    // /api/sectors/<sector>/reports — two visually separate panels.)
    async function selectSector(sectorName) {
        activeSector = sectorName;
        renderSectors();

        const panel = document.getElementById('reports-panel');
        const newsTitle = document.getElementById('news-title');
        const newsList = document.getElementById('news-list');
        const newsCount = document.getElementById('news-count');
        const reportsTitle = document.getElementById('reports-title');
        const reportsList = document.getElementById('reports-list');

        newsTitle.textContent = sectorName + ' — ' + t('industry.news');
        newsCount.textContent = '';
        newsList.innerHTML = `
            <div class="loading-cell">
                <div class="spinner-sm"></div>
                <span>${t('common.loading')}</span>
            </div>
        `;
        reportsTitle.textContent = sectorName + ' — ' + t('industry.reports');
        reportsList.innerHTML = `
            <div class="loading-cell">
                <div class="spinner-sm"></div>
                <span>${t('common.loading')}</span>
            </div>
        `;
        panel.style.display = 'block';
        panel.scrollIntoView({ behavior: 'smooth', block: 'start' });

        // Kick off both fetches in parallel — sector reports may take longer
        // (LIKE search across all reports), news is filtered by file_path prefix.
        const sectorEnc = encodeURIComponent(sectorName);
        const [newsRes, reportsRes] = await Promise.allSettled([
            fetch('/api/industry/' + sectorEnc + '/news').then(r => r.ok ? r.json() : []),
            fetch('/api/sectors/' + sectorEnc + '/reports').then(r => r.ok ? r.json() : []),
        ]);

        // News panel
        if (newsRes.status === 'fulfilled') {
            const news = newsRes.value;
            newsCount.textContent = t('industry.news_count', { n: news.length });
            renderReports(news, newsList, { isNews: true });
        } else {
            newsList.innerHTML = `
                <div class="empty-state">
                    <span class="material-icons-outlined empty-state-icon">error</span>
                    <div class="empty-state-title">${t('industry.news_error')}</div>
                </div>
            `;
        }

        // Reports panel (broader per-ticker search)
        if (reportsRes.status === 'fulfilled') {
            allSectorReports = reportsRes.value || [];
            buildReportsFilterRow(allSectorReports);
            renderSectorReports();
        } else {
            reportsList.innerHTML = `
                <div class="empty-state">
                    <span class="material-icons-outlined empty-state-icon">error</span>
                    <div class="empty-state-title">${t('industry.report_error')}</div>
                </div>
            `;
            document.getElementById('reports-filter-row').style.display = 'none';
        }
    }

    // v3.4.22 — Build dynamic category pills from data (sorted by count desc)
    function buildReportsFilterRow(reports) {
        const pillsContainer = document.getElementById('reports-category-pills');
        const filterRow = document.getElementById('reports-filter-row');
        if (!reports || reports.length === 0) {
            filterRow.style.display = 'none';
            return;
        }
        filterRow.style.display = 'flex';

        // Count by category
        const counts = {'all': reports.length};
        reports.forEach(r => {
            const c = r.category || 'unknown';
            counts[c] = (counts[c] || 0) + 1;
        });

        // Pills order: 全部, then categories sorted by count desc
        const categories = Object.entries(counts)
            .filter(([k]) => k !== 'all')
            .sort((a, b) => b[1] - a[1])
            .map(([k]) => k);

        // Build HTML
        const allPill = `<button class="sector-pill ${reportsFilter === 'all' ? 'active' : ''}" data-category="all">
            ${t('industry.filter_all')} <span style="opacity:.6; margin-left:4px;">${counts.all}</span>
        </button>`;
        const catPills = categories.map(c => {
            const key = c === 'earnings' ? 'industry.filter_earnings'
                       : c === 'analyst_report' ? 'industry.filter_analyst'
                       : c === 'sec_filing' ? 'industry.filter_sec'
                       : c === 'industry' ? 'industry.filter_industry'
                       : null;
            const label = key ? t(key) : c;
            return `<button class="sector-pill ${reportsFilter === c ? 'active' : ''}" data-category="${escHtml(c)}">
                ${escHtml(label)} <span style="opacity:.6; margin-left:4px;">${counts[c]}</span>
            </button>`;
        }).join('');

        pillsContainer.innerHTML = allPill + catPills;
    }

    // v3.4.22 — Apply filter + sort, re-render
    function renderSectorReports() {
        const list = document.getElementById('reports-list');
        const countBadge = document.getElementById('reports-filter-count');
        if (!allSectorReports || allSectorReports.length === 0) {
            list.innerHTML = `
                <div class="empty-state">
                    <span class="material-icons-outlined empty-state-icon">description</span>
                    <div class="empty-state-title">${t('industry.no_reports')}</div>
                </div>
            `;
            countBadge.textContent = '';
            return;
        }

        // Filter
        let filtered = reportsFilter === 'all'
            ? allSectorReports.slice()
            : allSectorReports.filter(r => r.category === reportsFilter);

        // Sort by published_at / created_at
        filtered.sort((a, b) => {
            const da = new Date(a.published_at || a.created_at || 0).getTime();
            const db = new Date(b.published_at || b.created_at || 0).getTime();
            return reportsSort === 'desc' ? (db - da) : (da - db);
        });

        // Update count badge
        const filterActive = reportsFilter !== 'all';
        if (filterActive) {
            countBadge.textContent = t('industry.count_filtered', { shown: filtered.length, total: allSectorReports.length });
        } else {
            countBadge.textContent = t('industry.count_total', { total: allSectorReports.length });
        }

        // Empty state distinction: data exists but filter excluded all
        if (filtered.length === 0 && filterActive) {
            list.innerHTML = `
                <div class="empty-state">
                    <span class="material-icons-outlined empty-state-icon">filter_alt_off</span>
                    <div class="empty-state-title">${t('industry.no_filter_match')}</div>
                    <div class="empty-state-text">${t('industry.try_other_filter')}</div>
                </div>
            `;
            return;
        }

        renderReports(filtered, list, { isNews: false });
    }

    function renderReports(reports, listEl, opts = {}) {
        const isNews = opts.isNews || false;
        if (!reports.length) {
            listEl.innerHTML = `
                <div class="empty-state">
                    <span class="material-icons-outlined empty-state-icon">${isNews ? 'article' : 'description'}</span>
                    <div class="empty-state-title">${isNews ? t('industry.no_news') : t('industry.no_reports')}</div>
                </div>
            `;
            return;
        }

        listEl.innerHTML = reports.map(r => {
            const summary = (r.summary || r.title || '').substring(0, 80);
            const source = r.source || '—';
            const date = r.published_at || r.created_at || '';
            const dateStr = date ? new Date(date).toLocaleDateString('zh-TW') : '—';
            
            // Determine icon based on category
            let icon = 'description';
            let iconBg = 'rgba(73, 79, 223, 0.15)';
            let iconColor = 'var(--blue)';
            
            if (r.category === 'earnings') {
                icon = 'assessment';
                iconBg = 'rgba(0, 200, 83, 0.15)';
                iconColor = 'var(--green)';
            } else if (r.category === 'industry' || r.category === 'news') {
                icon = 'article';
                iconBg = 'rgba(255, 214, 0, 0.15)';
                iconColor = 'var(--yellow)';
            }

            return `
                <a href="/report/${r.id}" class="report-card">
                    <div class="report-card-header">
                        <div class="report-icon" style="background:${iconBg}">
                            <span class="material-icons-outlined" style="color:${iconColor}">${icon}</span>
                        </div>
                        <div style="flex:1; min-width:0;">
                            <div class="report-title">${escHtml(r.title || 'Untitled')}</div>
                            <div class="report-summary">${escHtml(summary)}${summary.length >= 80 ? '...' : ''}</div>
                        </div>
                    </div>
                    <div class="report-meta">
                        <span class="report-source">
                            <span class="material-icons-outlined" style="font-size:14px">source</span>
                            ${escHtml(source)}
                        </span>
                        <span class="report-date">
                            <span class="material-icons-outlined" style="font-size:14px">schedule</span>
                            ${dateStr}
                        </span>
                    </div>
                </a>
            `;
        }).join('');
    }

    function closeReports() {
        activeSector = null;
        document.getElementById('reports-panel').style.display = 'none';
        renderSectors();
    }

    // Collect news
    async function collectNews() {
        const btn = document.getElementById('btn-collect');
        const label = document.getElementById('collect-label');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner-sm"></div> ' + t('industry.collecting');

        try {
            const res = await fetch('/api/reports/collect', { method: 'POST' });
            const data = await res.json();
            if (res.ok) {
                showToast('收集完成！', 'success');
                loadSectors();
                if (activeSector) selectSector(activeSector);
            } else {
                showToast(data.error || '收集失敗', 'error');
            }
        } catch (e) {
            showToast('網絡錯誤', 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = `
                <span class="material-icons-outlined" style="font-size:18px">refresh</span>
                <span>${t('industry.collect')}</span>
            `;
        }
    }

    // Helpers
    function escHtml(str) {
        const d = document.createElement('div');
        d.textContent = str || '';
        return d.innerHTML;
    }
</script>
{% endblock %}
