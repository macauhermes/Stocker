{% extends "base.html" %}
{% block title %}Stocker — Dashboard{% endblock %}

{% block content %}
<div class="dashboard">
    <!-- Event Reminder Banner -->
    <div id="event-banner" class="event-banner" style="display:none;">
        <span class="event-icon">⚠️</span>
        <span id="event-banner-text"></span>
        <button class="btn-pill btn-pill-sm btn-dismiss" onclick="dismissBanner()" data-i18n="index.event_dismiss">已知悉</button>
    </div>

    <!-- Tab Navigation -->
    <div class="tab-header">
        <div class="tabs">
            <button class="tab-btn active" data-tab="stocks" data-i18n="index.tab.stocks">股票</button>
            <button class="tab-btn" data-tab="reports" data-i18n="index.tab.reports">報告</button>
            <button class="tab-btn" data-tab="archived" data-i18n="index.tab.archived">歸檔</button>
        </div>
        <button class="btn-pill btn-primary" id="btn-add-ticker" onclick="openAddModal()" data-i18n="index.add">+ 新增</button>
    </div>

    <!-- Stocks Tab -->
    <div class="tab-content active" id="tab-stocks">
        <div class="table-container">
            <table class="stock-table" id="stock-table">
                <thead>
                    <tr>
                        <th data-i18n="stock.ticker">Ticker</th>
                        <th data-i18n="stock.name">Name</th>
                        <th data-i18n="stock.price">Price</th>
                        <th data-i18n="stock.change">Change%</th>
                        <th data-i18n="stock.prev_close">Prev Close</th>
                        <th data-i18n="stock.mini_chart">Mini Chart</th>
                        <th data-i18n="stock.shares">Shares</th>
                        <th data-i18n="stock.pnl">P&L</th>
                        <th data-i18n="stock.pnl_pct">P&L%</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="stock-table-body">
                    <tr><td colspan="10" class="loading-cell"><div class="spinner-sm"></div> <span data-i18n="common.loading">Loading...</span></td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Reports Tab -->
    <div class="tab-content" id="tab-reports">
        <div class="sector-filter-bar" id="sector-filter-bar" style="display:flex;gap:8px;padding:12px 0;flex-wrap:wrap;">
            <button class="sector-pill active" data-sector="all" onclick="filterBySector('all')" data-i18n="common.all" style="padding:4px 14px;border-radius:20px;border:1px solid var(--border,#333);background:var(--accent,#00c853);color:#fff;cursor:pointer;font-size:0.85rem;">All</button>
        </div>
        <div class="report-list" id="report-list">
            <div class="loading-cell"><div class="spinner-sm"></div> <span data-i18n="common.loading">Loading...</span></div>
        </div>
    </div>

    <!-- Archived Tab -->
    <div class="tab-content" id="tab-archived">
        <div class="table-container">
            <table class="stock-table" id="archived-table">
                <thead>
                    <tr>
                        <th data-i18n="stock.symbol">Symbol</th>
                        <th data-i18n="stock.name">Name</th>
                        <th data-i18n="stock.sector">Sector</th>
                        <th data-i18n="stock.archived_date">Archived Date</th>
                        <th data-i18n="stock.action">Action</th>
                    </tr>
                </thead>
                <tbody id="archived-table-body">
                    <tr><td colspan="5" class="loading-cell"><div class="spinner-sm"></div> <span data-i18n="common.loading">Loading...</span></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add Ticker Modal -->
<div class="modal-overlay" id="add-modal" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            <h3 data-i18n="index.add_title">新增追蹤股票</h3>
            <button class="modal-close" onclick="closeAddModal()">&times;</button>
        </div>
        <div class="modal-body">
            <input type="text" id="input-symbol" class="input-field" placeholder="輸入股票代碼 (e.g. AAPL)" data-i18n="index.symbol_placeholder" autocomplete="off">
            <div id="add-error" class="error-text" style="display:none;"></div>
        </div>
        <div class="modal-footer">
            <button class="btn-pill btn-secondary" onclick="closeAddModal()" data-i18n="common.cancel">取消</button>
            <button class="btn-pill btn-primary" id="btn-confirm-add" onclick="addTicker()" data-i18n="index.confirm_add">確認新增</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const miniCharts = {};

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            if (btn.dataset.tab === 'archived' && !archivedLoaded) {
                archivedLoaded = true;
                loadArchived();
            }
        });
    });

    // Load active events
    async function loadEvents() {
        try {
            const res = await fetch('/api/events/active');
            if (!res.ok) return;
            const events = await res.json();
            if (events && events.length > 0) {
                const banner = document.getElementById('event-banner');
                const text = events.map(e => {
                    const d = new Date(e.event_date).toLocaleDateString('zh-TW');
                    return `${e.title} — ${d}`;
                }).join('  |  ');
                document.getElementById('event-banner-text').textContent = text;
                banner.style.display = 'flex';
            }
        } catch (err) {
            console.error('Failed to load events:', err);
        }
    }

    // Load stock tickers
    async function loadStocks() {
        try {
            const res = await fetch('/api/tickers');
            if (!res.ok) throw new Error('Failed to fetch tickers');
            const tickers = await res.json();
            renderStocks(tickers);
        } catch (err) {
            console.error(err);
            document.getElementById('stock-table-body').innerHTML =
                '<tr><td colspan="10" class="error-cell">⚠️ ' + t('common.error') + '</td></tr>';
        }
    }

    function renderStocks(tickers) {
        const tbody = document.getElementById('stock-table-body');
        if (!tickers || tickers.length === 0) {
            tbody.innerHTML = '<tr><td colspan="10" class="empty-cell">' + t('index.empty_stocks') + '</td></tr>';
            return;
        }
        // Destroy old mini charts
        Object.values(miniCharts).forEach(c => c.destroy());
        Object.keys(miniCharts).forEach(k => delete miniCharts[k]);

        tbody.innerHTML = '';
        tickers.forEach(ticker => {
            const price = ticker.current_price;
            const changePct = ticker.change_percent;
            const shares = ticker.shares_held;
            const costBasis = ticker.cost_basis;
            const pnl = (price && shares && costBasis) ? (price - costBasis) * shares : null;
            const pnlPct = (price && costBasis && costBasis > 0) ? ((price - costBasis) / costBasis * 100) : null;
            const changeClass = changePct >= 0 ? 'text-green' : 'text-red';
            const pnlClass = (pnl && pnl >= 0) ? 'text-green' : 'text-red';
            const sign = v => v > 0 ? '+' : '';

            const tr = document.createElement('tr');
            tr.className = 'stock-row';
            tr.onclick = () => window.location.href = '/stock/' + ticker.symbol;
            tr.innerHTML = `
                <td class="ticker-symbol">${ticker.symbol}</td>
                <td class="ticker-name">${ticker.name || '—'}${ticker.sector ? ' <span style="display:inline-block;padding:1px 8px;margin-left:6px;border-radius:10px;background:rgba(0,200,83,0.15);color:#00c853;font-size:0.75rem;vertical-align:middle;">' + ticker.sector + '</span>' : ''}</td>
                <td class="price">${price != null ? '$' + price.toFixed(2) : '—'}</td>
                <td class="${changeClass}">${changePct != null ? sign(changePct) + changePct.toFixed(2) + '%' : '—'}</td>
                <td>${ticker.prev_close != null ? '$' + ticker.prev_close.toFixed(2) : '—'}</td>
                <td><canvas class="mini-chart" id="mini-${ticker.symbol}" width="100" height="32"></canvas></td>
                <td>${shares > 0 ? shares : '—'}</td>
                <td class="${pnlClass}">${pnl != null ? (pnl >= 0 ? '+$' : '-$') + Math.abs(pnl).toFixed(2) : '—'}</td>
                <td class="${pnlClass}">${pnlPct != null ? sign(pnlPct) + pnlPct.toFixed(2) + '%' : '—'}</td>
                <td><button style="padding:2px 10px;border-radius:12px;border:1px solid #ff1744;background:transparent;color:#ff1744;cursor:pointer;font-size:0.8rem;" onclick="event.stopPropagation(); archiveTicker('${ticker.symbol}')">${t('stock.archive')}</button></td>
            `;
            tbody.appendChild(tr);

            // Draw mini chart
            if (ticker.mini_chart_data && ticker.mini_chart_data.length > 0) {
                drawMiniChart(ticker.symbol, ticker.mini_chart_data);
            }
        });
    }

    function drawMiniChart(symbol, data) {
        const canvas = document.getElementById('mini-' + symbol);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const isUp = data[data.length - 1] >= data[0];
        const color = isUp ? '#00c853' : '#ff1744';
        miniCharts[symbol] = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.map((_, i) => i),
                datasets: [{
                    data: data,
                    borderColor: color,
                    borderWidth: 1.5,
                    pointRadius: 0,
                    tension: 0.3,
                    fill: false
                }]
            },
            options: {
                responsive: false,
                maintainAspectRatio: false,
                plugins: { legend: { display: false }, tooltip: { enabled: false } },
                scales: { x: { display: false }, y: { display: false } },
                elements: { line: { borderJoinStyle: 'round' } }
            }
        });
    }

    // Sector filter state
    let currentSector = 'all';
    let allReports = [];

    async function loadSectors() {
        try {
            const res = await fetch('/api/sectors');
            if (!res.ok) return;
            const sectors = await res.json();
            const bar = document.getElementById('sector-filter-bar');
            sectors.forEach(s => {
                const pill = document.createElement('button');
                pill.className = 'sector-pill';
                pill.dataset.sector = s;
                pill.textContent = s;
                pill.style.cssText = 'padding:4px 14px;border-radius:20px;border:1px solid var(--border,#333);background:transparent;color:var(--text,#ccc);cursor:pointer;font-size:0.85rem;transition:all 0.2s;';
                pill.onclick = () => filterBySector(s);
                bar.appendChild(pill);
            });
        } catch (err) {
            console.error('Failed to load sectors:', err);
        }
    }

    async function filterBySector(sector) {
        currentSector = sector;
        document.querySelectorAll('.sector-pill').forEach(p => {
            if (p.dataset.sector === sector) {
                p.style.background = 'var(--accent,#00c853)';
                p.style.color = '#fff';
                p.classList.add('active');
            } else {
                p.style.background = 'transparent';
                p.style.color = 'var(--text,#ccc)';
                p.classList.remove('active');
            }
        });
        if (sector === 'all') {
            renderReports(allReports);
        } else {
            try {
                const res = await fetch('/api/sectors/' + encodeURIComponent(sector) + '/reports');
                if (!res.ok) throw new Error('Failed');
                const reports = await res.json();
                renderReports(reports);
            } catch (err) {
                console.error(err);
                document.getElementById('report-list').innerHTML =
                    '<div class="error-cell">⚠️ ' + t('common.error') + '</div>';
            }
        }
    }

    // Load reports
    async function loadReports() {
        try {
            const res = await fetch('/api/reports');
            if (!res.ok) throw new Error('Failed to fetch reports');
            const reports = await res.json();
            allReports = reports;
            renderReports(reports);
        } catch (err) {
            console.error(err);
            document.getElementById('report-list').innerHTML =
                '<div class="error-cell">⚠️ ' + t('common.error') + '</div>';
        }
    }

    function renderReports(reports) {
        const list = document.getElementById('report-list');
        if (!reports || reports.length === 0) {
            list.innerHTML = '<div class="empty-cell">' + t('reports.empty') + '</div>';
            return;
        }
        list.innerHTML = '';
        reports.forEach(r => {
            const summary = r.summary ? r.summary.substring(0, 50) + (r.summary.length > 50 ? '...' : '') : '—';
            const date = r.published_at ? new Date(r.published_at).toLocaleDateString('zh-TW') : '—';
            const card = document.createElement('a');
            card.href = '/report/' + r.id;
            card.className = 'report-card';
            card.innerHTML = `
                <div class="report-card-body">
                    <h4 class="report-title">${r.title || t('common.untitled')}</h4>
                    <p class="report-summary">${summary}</p>
                </div>
                <div class="report-card-meta">
                    <span class="report-source">${r.source || '—'}</span>
                    <span class="report-date">${date}</span>
                </div>
            `;
            list.appendChild(card);
        });
    }

    // Add Ticker Modal
    function openAddModal() {
        document.getElementById('add-modal').style.display = 'flex';
        document.getElementById('input-symbol').value = '';
        document.getElementById('add-error').style.display = 'none';
        document.getElementById('input-symbol').focus();
    }

    function closeAddModal() {
        document.getElementById('add-modal').style.display = 'none';
    }

    async function addTicker() {
        const symbol = document.getElementById('input-symbol').value.trim().toUpperCase();
        const errEl = document.getElementById('add-error');
        if (!symbol) {
            errEl.textContent = t('index.enter_symbol');
            errEl.style.display = 'block';
            return;
        }
        errEl.style.display = 'none';
        const btn = document.getElementById('btn-confirm-add');
        btn.disabled = true;
        btn.textContent = t('index.adding');
        try {
            const res = await fetch('/api/tickers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ symbol: symbol })
            });
            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                throw new Error(data.error || t('common.error'));
            }
            closeAddModal();
            showToast(symbol + ' ' + t('index.added'), 'success');
            loadStocks();
        } catch (err) {
            errEl.textContent = err.message;
            errEl.style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.textContent = t('index.confirm_add');
        }
    }

    // Archive (soft delete) ticker
    async function archiveTicker(symbol) {
        if (!confirm(t('archive.confirm', {symbol}))) return;
        try {
            const res = await fetch('/api/tickers/' + symbol, { method: 'DELETE' });
            if (!res.ok) throw new Error(t('common.error'));
            showToast(symbol + ' ' + t('stock.archived'), 'success');
            loadStocks();
        } catch (err) {
            showToast(err.message, 'error');
        }
    }

    // Load archived tickers
    let archivedLoaded = false;
    async function loadArchived() {
        try {
            const res = await fetch('/api/tickers/archived');
            if (!res.ok) throw new Error('Failed to fetch archived tickers');
            const tickers = await res.json();
            renderArchived(tickers);
        } catch (err) {
            console.error(err);
            document.getElementById('archived-table-body').innerHTML =
                '<tr><td colspan="5" class="error-cell">⚠️ ' + t('common.error') + '</td></tr>';
        }
    }

    function renderArchived(tickers) {
        const tbody = document.getElementById('archived-table-body');
        if (!tickers || tickers.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-cell">' + t('archive.empty') + '</td></tr>';
            return;
        }
        tbody.innerHTML = '';
        tickers.forEach(ticker => {
            const archivedDate = ticker.archived_at ? new Date(ticker.archived_at).toLocaleDateString('zh-TW') : '—';
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="ticker-symbol">${ticker.symbol}</td>
                <td>${ticker.name || '—'}</td>
                <td>${ticker.sector || '—'}</td>
                <td>${archivedDate}</td>
                <td><button style="padding:2px 10px;border-radius:12px;border:1px solid var(--accent,#00c853);background:var(--accent,#00c853);color:#fff;cursor:pointer;font-size:0.8rem;" onclick="restoreTicker('${ticker.symbol}')">${t('stock.restore')}</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function restoreTicker(symbol) {
        try {
            const res = await fetch('/api/tickers/' + encodeURIComponent(symbol) + '/restore', { method: 'POST' });
            if (!res.ok) throw new Error(t('common.error'));
            showToast(symbol + ' ' + t('stock.restored'), 'success');
            loadArchived();
            loadStocks();
        } catch (err) {
            showToast(err.message, 'error');
        }
    }

    function dismissBanner() {
        document.getElementById('event-banner').style.display = 'none';
    }

    // Enter key in modal
    document.getElementById('input-symbol').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') addTicker();
    });

    // Close modal on overlay click
    document.getElementById('add-modal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('add-modal')) closeAddModal();
    });

    // Init
    loadEvents();
    loadStocks();
    loadReports();
    loadSectors();

    // Re-render dynamic content when language changes
    window.addEventListener('langchange', () => {
        loadStocks();
        loadReports();
        loadSectors();
        if (currentTab === 'archived' || document.querySelector('.tab-btn.active')?.dataset.tab === 'archived') {
            loadArchived();
        }
    });
</script>
{% endblock %}
