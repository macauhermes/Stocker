{% extends "base.html" %}
{% block title %}Stocker — Dashboard{% endblock %}

{% block content %}
<!-- Event Reminder Banner -->
<div id="event-banner" class="event-banner" style="display:none;">
    <span class="material-icons-outlined">warning</span>
    <span id="event-banner-text" class="event-text"></span>
    <button class="event-dismiss" onclick="dismissBanner()" data-i18n="index.event_dismiss">已知悉</button>
</div>

<!-- Portfolio Summary Card (v3.4.2) -->
<div id="portfolio-summary-card" class="portfolio-summary-card" style="display:none;">
    <div class="portfolio-summary-row">
        <div class="portfolio-stat">
            <div class="portfolio-stat-label" data-i18n="portfolio.total_value">總市值</div>
            <div class="portfolio-stat-value" id="portfolio-value">—</div>
        </div>
        <div class="portfolio-stat">
            <div class="portfolio-stat-label" data-i18n="portfolio.unrealized">未實現損益</div>
            <div class="portfolio-stat-value portfolio-stat-pnl" id="portfolio-pnl">—</div>
        </div>
        <div class="portfolio-stat">
            <div class="portfolio-stat-label" data-i18n="portfolio.change_30d">30日變化</div>
            <div class="portfolio-stat-value" id="portfolio-change">—</div>
        </div>
        <div class="portfolio-stat">
            <div class="portfolio-stat-label" data-i18n="portfolio.holdings_count">持倉數</div>
            <div class="portfolio-stat-value" id="portfolio-holdings">—</div>
        </div>
    </div>
    <div class="portfolio-meta">
        <span class="material-icons-outlined">schedule</span>
        <span id="portfolio-snapshot-date" data-i18n="portfolio.dashboard_no_history">尚未有投資組合歷史快照</span>
    </div>
</div>

<!-- Tab Navigation -->
<div class="tabs">
    <button class="tab-btn active" data-tab="stocks" onclick="switchTab('stocks')">
        <span class="material-icons-outlined">show_chart</span>
        <span data-i18n="index.tab.stocks">股票</span>
    </button>
    <button class="tab-btn" data-tab="reports" onclick="switchTab('reports')">
        <span class="material-icons-outlined">description</span>
        <span data-i18n="index.tab.reports">報告</span>
    </button>
    <button class="tab-btn" data-tab="archived" onclick="switchTab('archived')">
        <span class="material-icons-outlined">archive</span>
        <span data-i18n="index.tab.archived">歸檔</span>
    </button>
    <button class="tab-btn" data-tab="groups" onclick="switchTab('groups')">
        <span class="material-icons-outlined">bookmark</span>
        <span>分組</span>
    </button>
</div>

<!-- Stocks Tab -->
<div class="tab-content active" id="tab-stocks">
    <div id="stock-list" class="stock-list">
        <div class="loading-cell">
            <div class="spinner-sm"></div>
            <span data-i18n="common.loading">載入中...</span>
        </div>
    </div>
</div>

<!-- Reports Tab -->
<div class="tab-content" id="tab-reports">
    <!-- Sector Filter -->
    <div class="sector-pills" id="sector-pills">
        <button class="sector-pill active" data-sector="all" onclick="filterBySector('all')" data-i18n="common.all">全部</button>
    </div>
    
    <!-- Report Type Tabs -->
    <div class="tabs" style="margin-bottom: 12px;">
        <button class="tab-btn active" data-type="all" onclick="filterByType('all')">全部</button>
        <button class="tab-btn" data-type="earnings" onclick="filterByType('earnings')">
            <span class="material-icons-outlined">assessment</span>
            財報
        </button>
        <button class="tab-btn" data-type="news" onclick="filterByType('news')">
            <span class="material-icons-outlined">article</span>
            新聞
        </button>
        <button class="tab-btn" data-type="analyst" onclick="filterByType('analyst')">
            <span class="material-icons-outlined">analytics</span>
            分析
        </button>
    </div>
    
    <div id="report-list" class="report-list">
        <div class="loading-cell">
            <div class="spinner-sm"></div>
            <span data-i18n="common.loading">載入中...</span>
        </div>
    </div>
</div>

<!-- Archived Tab -->
<div class="tab-content" id="tab-archived">
    <div id="archived-list" class="stock-list">
        <div class="loading-cell">
            <div class="spinner-sm"></div>
            <span data-i18n="common.loading">載入中...</span>
        </div>
    </div>
</div>

<!-- Groups Tab -->
<div class="tab-content" id="tab-groups">
    <div style="display:flex; justify-content:flex-end; margin-bottom:12px;">
        <a href="/watchlists" class="btn btn-primary" style="font-size:0.85rem; text-decoration:none;">
            <span class="material-icons-outlined" style="font-size:16px;">settings</span>
            管理分組
        </a>
    </div>
    <div id="groups-dashboard"></div>
</div>

<!-- FAB (Floating Action Button) -->
<button class="fab" onclick="openAddModal()">
    <span class="material-icons-outlined">add</span>
</button>

<!-- Add Ticker Modal -->
<div class="modal-overlay" id="add-modal">
    <div class="modal">
        <div class="modal-handle"></div>
        <div class="modal-header">
            <h3 class="modal-title" data-i18n="index.add_title">新增追蹤股票</h3>
            <button class="modal-close" onclick="closeAddModal()">
                <span class="material-icons-outlined">close</span>
            </button>
        </div>
        <div class="modal-body">
            <div class="input-group">
                <label class="input-label" data-i18n="stock.ticker">股票代碼</label>
                <div class="input-icon">
                    <span class="material-icons-outlined">search</span>
                    <input type="text" id="input-symbol" class="input" placeholder="輸入股票代碼 (如 TSLA)" data-i18n="index.symbol_placeholder" autocomplete="off">
                </div>
                <div id="search-suggestions" class="search-suggestions" style="display:none;"></div>
            </div>
            <div id="add-preview" class="add-preview" style="display:none;"></div>
            <div id="add-error" class="error-text" style="display:none;">
                <span class="material-icons-outlined">error</span>
                <span id="add-error-msg"></span>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeAddModal()" data-i18n="common.cancel">取消</button>
            <button class="btn btn-primary" id="btn-confirm-add" onclick="addTicker()">
                <span class="material-icons-outlined">add</span>
                <span data-i18n="index.confirm_add">確認新增</span>
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const miniCharts = {};
    let currentTab = 'stocks';
    let currentSector = 'all';
    let currentType = 'all';
    let allReports = [];
    let archivedLoaded = false;
    let groupsLoaded = false;

    // Tab switching
    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
        document.getElementById('tab-' + tab).classList.add('active');
        
        if (tab === 'archived' && !archivedLoaded) {
            archivedLoaded = true;
            loadArchived();
        }
        if (tab === 'groups' && !groupsLoaded) {
            groupsLoaded = true;
            loadGroupsDashboard();
        }
    }

    // Load active events
    async function loadEvents() {
        try {
            const res = await fetch('/api/events/active');
            if (!res.ok) return;
            const events = await res.json();
            if (events && events.length > 0) {
                const banner = document.getElementById('event-banner');
                const text = events.map(e => {
                    const d = new Date(e.event_date).toLocaleDateString('zh-TW');
                    return `${e.title} — ${d}`;
                }).join('  |  ');
                document.getElementById('event-banner-text').textContent = text;
                banner.style.display = 'flex';
            }
        } catch (err) {
            console.error('Failed to load events:', err);
        }
    }

    // Portfolio summary (v3.4.2) — show top-of-dashboard widget with total value,
    // unrealized P&L, and 30-day change. Hides cleanly when there's no history.
    async function loadPortfolioSummary() {
        const card = document.getElementById('portfolio-summary-card');
        try {
            const res = await fetch('/api/portfolio/summary');
            if (!res.ok) {
                card.style.display = 'none';
                return;
            }
            const data = await res.json();
            if (!data.has_history || !data.latest) {
                card.style.display = 'none';
                return;
            }
            const v = data.latest;
            const valueEl = document.getElementById('portfolio-value');
            const pnlEl = document.getElementById('portfolio-pnl');
            const changeEl = document.getElementById('portfolio-change');
            const holdingsEl = document.getElementById('portfolio-holdings');
            const dateEl = document.getElementById('portfolio-snapshot-date');

            valueEl.textContent = formatCurrency(v.total_value);
            pnlEl.textContent = formatPnl(v.total_pnl, v.pnl_pct);
            pnlEl.classList.toggle('portfolio-positive', v.total_pnl > 0);
            pnlEl.classList.toggle('portfolio-negative', v.total_pnl < 0);
            holdingsEl.textContent = v.holdings_count;

            if (data.change_30d_value !== null && data.change_30d_value !== undefined) {
                changeEl.textContent = formatPnl(data.change_30d_value, data.change_30d_pct);
                changeEl.classList.toggle('portfolio-positive', data.change_30d_value > 0);
                changeEl.classList.toggle('portfolio-negative', data.change_30d_value < 0);
            } else {
                changeEl.textContent = '—';
                changeEl.classList.remove('portfolio-positive', 'portfolio-negative');
            }
            dateEl.textContent = t('portfolio.snapshot_today', { date: v.snapshot_date });
            card.style.display = 'block';
        } catch (err) {
            console.error('Failed to load portfolio summary:', err);
            card.style.display = 'none';
        }
    }

    function formatCurrency(n) {
        if (n == null || isNaN(n)) return '—';
        return '$' + Number(n).toLocaleString('en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
        });
    }

    function formatPnl(amount, pct) {
        if (amount == null || isNaN(amount)) return '—';
        const sign = amount >= 0 ? '+' : '';
        const pctText = (pct != null && !isNaN(pct))
            ? ` (${sign}${Number(pct).toFixed(2)}%)`
            : '';
        return `${sign}${formatCurrency(amount)}${pctText}`;
    }

    // Load stock tickers
    async function loadStocks() {
        try {
            const res = await fetch('/api/tickers');
            if (!res.ok) throw new Error('Failed to fetch tickers');
            const tickers = await res.json();
            renderStocks(tickers);
        } catch (err) {
            console.error(err);
            document.getElementById('stock-list').innerHTML = `
                <div class="empty-state">
                    <span class="material-icons-outlined empty-state-icon">error</span>
                    <div class="empty-state-title">${t('common.error')}</div>
                    <button class="btn btn-secondary mt-16" onclick="loadStocks()">
                        <span class="material-icons-outlined">refresh</span>
                        ${t('common.retry')}
                    </button>
                </div>
            `;
        }
    }

    function renderStocks(tickers) {
        const container = document.getElementById('stock-list');
        if (!tickers || tickers.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <span class="material-icons-outlined empty-state-icon">show_chart</span>
                    <div class="empty-state-title">${t('index.empty_stocks')}</div>
                    <button class="btn btn-primary mt-16" onclick="openAddModal()">
                        <span class="material-icons-outlined">add</span>
                        ${t('index.add')}
                    </button>
                </div>
            `;
            return;
        }
        
        // Destroy old mini charts
        Object.values(miniCharts).forEach(c => c.destroy());
        Object.keys(miniCharts).forEach(k => delete miniCharts[k]);
        
        container.innerHTML = '';
        tickers.forEach(ticker => {
            const price = ticker.current_price;
            const changePct = ticker.change_percent;
            const changeClass = changePct >= 0 ? 'text-green' : 'text-red';
            const sign = v => v > 0 ? '+' : '';
            
            const card = document.createElement('div');
            card.className = 'stock-card';
            card.dataset.symbol = ticker.symbol;
            card.onclick = () => window.location.href = '/stock/' + ticker.symbol;
            card.innerHTML = `
                <div class="stock-icon">${ticker.symbol.substring(0, 2)}</div>
                <div class="stock-info">
                    <div class="stock-symbol">
                        ${ticker.symbol}
                        ${ticker.sector ? `<span class="stock-sector">${ticker.sector}</span>` : ''}
                        <span class="source-badge source-${(ticker.data_source || 'unknown').replace(/_/g, '-')}" title="${ticker.data_source || 'unknown'}">${sourceLabel(ticker.data_source)}</span>
                        <span class="freshness-badge ${freshnessClass(ticker.last_updated)}" data-ts="${ticker.last_updated || ''}" title="Last updated: ${ticker.last_updated || 'unknown'}">${timeAgo(ticker.last_updated)}</span>
                    </div>
                    <div class="stock-name">${ticker.name || '—'}</div>
                </div>
                <div class="stock-mini-chart">
                    <canvas id="mini-${ticker.symbol}" width="80" height="32"></canvas>
                </div>
                <div class="stock-price-section">
                    <div class="stock-price" data-price="${ticker.symbol}">${price != null ? '$' + price.toFixed(2) : '—'}</div>
                    <div class="stock-change ${changeClass}" data-change="${ticker.symbol}">${changePct != null ? sign(changePct) + changePct.toFixed(2) + '%' : '—'}</div>
                </div>
            `;
            container.appendChild(card);
            
            // Draw mini chart
            if (ticker.mini_chart_data && ticker.mini_chart_data.length > 0) {
                drawMiniChart(ticker.symbol, ticker.mini_chart_data);
            }
        });
    }

    function drawMiniChart(symbol, data) {
        const canvas = document.getElementById('mini-' + symbol);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const isUp = data[data.length - 1] >= data[0];
        const color = isUp ? '#00c853' : '#ff1744';
        miniCharts[symbol] = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.map((_, i) => i),
                datasets: [{
                    data: data,
                    borderColor: color,
                    borderWidth: 1.5,
                    pointRadius: 0,
                    tension: 0.3,
                    fill: false
                }]
            },
            options: {
                responsive: false,
                maintainAspectRatio: false,
                plugins: { legend: { display: false }, tooltip: { enabled: false } },
                scales: { x: { display: false }, y: { display: false } },
                elements: { line: { borderJoinStyle: 'round' } }
            }
        });
    }

    // Source badge label helper
    function sourceLabel(source) {
        const labels = {
            'yfinance': 'YF',
            'yahoo_direct': 'Y!',
            'stooq': 'SQ',
            'coingecko': 'CG',
            'custom': '✦',
        };
        return labels[source] || '?';
    }

    // Relative time helper (e.g. "3s ago", "5m ago")
    function timeAgo(isoString) {
        if (!isoString) return '';
        const seconds = Math.floor((Date.now() - new Date(isoString).getTime()) / 1000);
        if (seconds < 0) return 'just now';
        if (seconds < 10) return 'just now';
        if (seconds < 60) return seconds + 's ago';
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return minutes + 'm ago';
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return hours + 'h ago';
        return Math.floor(hours / 24) + 'd ago';
    }

    // Freshness CSS class based on age
    function freshnessClass(isoString) {
        if (!isoString) return 'fresh-unknown';
        const seconds = Math.floor((Date.now() - new Date(isoString).getTime()) / 1000);
        if (seconds < 60) return 'fresh-green';    // <1min = green
        if (seconds < 300) return 'fresh-yellow';  // <5min = yellow
        return 'fresh-grey';                        // >=5min = grey
    }

    // Auto-update all freshness badges every 5s
    let freshnessTimer = null;
    function startFreshnessUpdater() {
        if (freshnessTimer) clearInterval(freshnessTimer);
        freshnessTimer = setInterval(() => {
            document.querySelectorAll('.freshness-badge[data-ts]').forEach(el => {
                const ts = el.dataset.ts;
                el.textContent = timeAgo(ts);
                el.className = 'freshness-badge ' + freshnessClass(ts);
            });
        }, 5000);
    }

    // Sector filter
    async function loadSectors() {
        try {
            const res = await fetch('/api/sectors');
            if (!res.ok) return;
            const sectors = await res.json();
            const container = document.getElementById('sector-pills');
            sectors.forEach(s => {
                const pill = document.createElement('button');
                pill.className = 'sector-pill';
                pill.dataset.sector = s;
                pill.textContent = s;
                pill.onclick = () => filterBySector(s);
                container.appendChild(pill);
            });
        } catch (err) {
            console.error('Failed to load sectors:', err);
        }
    }

    function filterBySector(sector) {
        currentSector = sector;
        document.querySelectorAll('.sector-pill').forEach(p => {
            p.classList.toggle('active', p.dataset.sector === sector);
        });
        applyFilters();
    }

    function filterByType(type) {
        currentType = type;
        document.querySelectorAll('[data-type]').forEach(b => {
            b.classList.toggle('active', b.dataset.type === type);
        });
        applyFilters();
    }

    function applyFilters() {
        let filtered = allReports;
        
        // Filter by type
        if (currentType !== 'all') {
            if (currentType === 'earnings') {
                filtered = filtered.filter(r => r.category === 'earnings');
            } else if (currentType === 'news') {
                filtered = filtered.filter(r => r.category === 'industry' || r.category === 'news');
            } else if (currentType === 'analyst') {
                filtered = filtered.filter(r => r.category === 'analyst_report');
            }
        }
        
        // Filter by sector
        if (currentSector !== 'all') {
            // This would need sector info in reports, for now just show all
        }
        
        renderReports(filtered);
    }

    // Load reports
    async function loadReports() {
        try {
            const res = await fetch('/api/reports');
            if (!res.ok) throw new Error('Failed to fetch reports');
            const reports = await res.json();
            allReports = reports;
            renderReports(reports);
        } catch (err) {
            console.error(err);
            document.getElementById('report-list').innerHTML = `
                <div class="empty-state">
                    <span class="material-icons-outlined empty-state-icon">error</span>
                    <div class="empty-state-title">${t('common.error')}</div>
                </div>
            `;
        }
    }

    function renderReports(reports) {
        const list = document.getElementById('report-list');
        if (!reports || reports.length === 0) {
            list.innerHTML = `
                <div class="empty-state">
                    <span class="material-icons-outlined empty-state-icon">description</span>
                    <div class="empty-state-title">${t('reports.empty')}</div>
                </div>
            `;
            return;
        }
        
        list.innerHTML = '';
        reports.forEach(r => {
            const summary = r.summary ? r.summary.substring(0, 80) + (r.summary.length > 80 ? '...' : '') : '—';
            const date = r.published_at ? new Date(r.published_at).toLocaleDateString('zh-TW') : '—';
            
            // Determine icon based on category
            let icon = 'description';
            let iconBg = 'rgba(73, 79, 223, 0.15)';
            let iconColor = 'var(--blue)';
            
            if (r.category === 'earnings') {
                icon = 'assessment';
                iconBg = 'rgba(0, 200, 83, 0.15)';
                iconColor = 'var(--green)';
            } else if (r.category === 'industry' || r.category === 'news') {
                icon = 'article';
                iconBg = 'rgba(255, 214, 0, 0.15)';
                iconColor = 'var(--yellow)';
            } else if (r.category === 'analyst_report') {
                icon = 'analytics';
                iconBg = 'rgba(73, 79, 223, 0.15)';
                iconColor = 'var(--blue)';
            }
            
            const card = document.createElement('a');
            card.href = '/report/' + r.id;
            card.className = 'report-card';
            card.innerHTML = `
                <div class="report-card-header">
                    <div class="report-icon" style="background:${iconBg}">
                        <span class="material-icons-outlined" style="color:${iconColor}">${icon}</span>
                    </div>
                    <div style="flex:1; min-width:0;">
                        <div class="report-title">${r.title || t('common.untitled')}</div>
                        <div class="report-summary">${summary}</div>
                    </div>
                </div>
                <div class="report-meta">
                    <span class="report-source">
                        <span class="material-icons-outlined" style="font-size:14px">source</span>
                        ${r.source || '—'}
                    </span>
                    <span class="report-date">
                        <span class="material-icons-outlined" style="font-size:14px">schedule</span>
                        ${date}
                    </span>
                </div>
            `;
            list.appendChild(card);
        });
    }

    // Add Ticker Modal
    function openAddModal() {
        document.getElementById('add-modal').classList.add('open');
        document.getElementById('input-symbol').value = '';
        document.getElementById('add-error').style.display = 'none';
        setTimeout(() => document.getElementById('input-symbol').focus(), 300);
    }

    function closeAddModal() {
        document.getElementById('add-modal').classList.remove('open');
    }

    async function addTicker() {
        const symbol = document.getElementById('input-symbol').value.trim().toUpperCase();
        const errEl = document.getElementById('add-error');
        const errMsg = document.getElementById('add-error-msg');
        
        if (!symbol) {
            errMsg.textContent = t('index.enter_symbol');
            errEl.style.display = 'flex';
            return;
        }
        
        errEl.style.display = 'none';
        const btn = document.getElementById('btn-confirm-add');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner-sm"></div> ' + t('index.adding');
        
        try {
            const res = await fetch('/api/tickers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ symbol: symbol })
            });
            
            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                throw new Error(data.error || t('common.error'));
            }
            
            closeAddModal();
            showToast(symbol + ' ' + t('index.added'), 'success');
            loadStocks();
        } catch (err) {
            errMsg.textContent = err.message;
            errEl.style.display = 'flex';
        } finally {
            btn.disabled = false;
            btn.innerHTML = `
                <span class="material-icons-outlined">add</span>
                <span>${t('index.confirm_add')}</span>
            `;
        }
    }

    // Archive ticker
    async function archiveTicker(symbol) {
        if (!confirm(t('archive.confirm', {symbol}))) return;
        try {
            const res = await fetch('/api/tickers/' + symbol, { method: 'DELETE' });
            if (!res.ok) throw new Error(t('common.error'));
            showToast(symbol + ' ' + t('stock.archived'), 'success');
            loadStocks();
        } catch (err) {
            showToast(err.message, 'error');
        }
    }

    // Load archived tickers
    async function loadArchived() {
        try {
            const res = await fetch('/api/tickers/archived');
            if (!res.ok) throw new Error('Failed to fetch archived tickers');
            const tickers = await res.json();
            renderArchived(tickers);
        } catch (err) {
            console.error(err);
            document.getElementById('archived-list').innerHTML = `
                <div class="empty-state">
                    <span class="material-icons-outlined empty-state-icon">error</span>
                    <div class="empty-state-title">${t('common.error')}</div>
                </div>
            `;
        }
    }

    function renderArchived(tickers) {
        const container = document.getElementById('archived-list');
        if (!tickers || tickers.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <span class="material-icons-outlined empty-state-icon">archive</span>
                    <div class="empty-state-title">${t('archive.empty')}</div>
                </div>
            `;
            return;
        }
        
        container.innerHTML = '';
        tickers.forEach(ticker => {
            const archivedDate = ticker.archived_at ? new Date(ticker.archived_at).toLocaleDateString('zh-TW') : '—';
            const card = document.createElement('div');
            card.className = 'stock-card';
            card.innerHTML = `
                <div class="stock-icon">${ticker.symbol.substring(0, 2)}</div>
                <div class="stock-info">
                    <div class="stock-symbol">${ticker.symbol}</div>
                    <div class="stock-name">${ticker.name || '—'}</div>
                    <div style="font-size:0.75rem; color:var(--text-muted); margin-top:4px;">
                        ${ticker.sector || '—'} · ${t('stock.archived_date')}: ${archivedDate}
                    </div>
                </div>
                <button class="btn btn-sm btn-success" onclick="restoreTicker('${ticker.symbol}')">
                    <span class="material-icons-outlined" style="font-size:16px">restore</span>
                    ${t('stock.restore')}
                </button>
            `;
            container.appendChild(card);
        });
    }

    async function restoreTicker(symbol) {
        try {
            const res = await fetch('/api/tickers/' + encodeURIComponent(symbol) + '/restore', { method: 'POST' });
            if (!res.ok) throw new Error(t('common.error'));
            showToast(symbol + ' ' + t('stock.restored'), 'success');
            loadArchived();
            loadStocks();
        } catch (err) {
            showToast(err.message, 'error');
        }
    }

    // Groups dashboard tab
    async function loadGroupsDashboard() {
        try {
            const res = await fetch('/api/watchlist-groups');
            if (!res.ok) throw new Error('Failed');
            const groups = await res.json();
            const el = document.getElementById('groups-dashboard');
            if (!groups.length) {
                el.innerHTML = `
                    <div class="empty-state">
                        <span class="material-icons-outlined empty-state-icon">bookmark_border</span>
                        <div class="empty-state-title">尚未建立追蹤分組</div>
                        <a href="/watchlists" class="btn btn-primary" style="margin-top:12px;">建立分組</a>
                    </div>`;
                return;
            }
            el.innerHTML = groups.map(g => {
                const tickers = (g.tickers || []).map(t =>
                    `<a href="/stock/${t.symbol}" style="color:var(--text); text-decoration:none; display:inline-flex; align-items:center; gap:4px; background:var(--chip-bg, rgba(255,255,255,0.06)); border:1px solid var(--border, #2a2a3e); border-radius:20px; padding:6px 12px; margin:3px; font-size:0.85rem; transition:border-color 0.15s;" onmouseover="this.style.borderColor='var(--accent,#4fc3f7)'" onmouseout="this.style.borderColor='var(--border,#2a2a3e)'">${t.symbol}</a>`
                ).join('');
                return `
                    <div style="background:var(--card-bg,#1a1a2e); border:1px solid var(--border,#2a2a3e); border-radius:12px; margin-bottom:10px; border-left:3px solid ${g.color};">
                        <div style="padding:12px 16px;">
                            <div style="font-weight:600; font-size:0.95rem;">${escHtml(g.name)} <span style="color:var(--text-muted); font-size:0.8rem;">${g.ticker_count} 股</span></div>
                            ${g.description ? `<div style="color:var(--text-muted); font-size:0.8rem; margin-top:2px;">${escHtml(g.description)}</div>` : ''}
                        </div>
                        <div style="padding:0 16px 12px;">
                            ${tickers || '<span style="color:var(--text-muted); font-size:0.8rem;">空</span>'}
                        </div>
                    </div>`;
            }).join('');
        } catch (err) {
            console.error('loadGroupsDashboard:', err);
        }
    }

    function escHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function dismissBanner() {
        document.getElementById('event-banner').style.display = 'none';
    }

    // Enter key in modal
    document.getElementById('input-symbol').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') addTicker();
    });

    // Close modal on overlay click
    document.getElementById('add-modal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('add-modal')) closeAddModal();
    });

    // Init
    loadEvents();
    loadPortfolioSummary();
    loadStocks();
    loadReports();
    loadSectors();
    startFreshnessUpdater();  // Auto-update freshness badges every 5s

    // ── Smart polling (wealthlens-style) ─────────────────────────────
    let pollInterval = 60;  // default 60s, will be updated by /api/refresh-interval
    let pollTimer = null;

    async function refreshPolling() {
        try {
            const r = await fetch('/api/refresh-interval');
            const d = await r.json();
            pollInterval = d.interval || 60;
            // Update visible badge if present
            const badge = document.getElementById('refresh-badge');
            if (badge) {
                const reasonMap = {us_market_open:'盤中',us_extended_hours:'盤後',us_off_hours:'收盤',weekend:'週末'};
                badge.textContent = `${reasonMap[d.reason] || d.reason} • ${pollInterval}s`;
                badge.dataset.reason = d.reason;
            }
        } catch (e) { console.debug('refresh interval fetch failed', e); }
    }

    // ── SSE client for live price updates ───────────────────────
    let sseConnection = null;
    let sseRetryTimer = null;

    function updateSSEPrices(snapshot) {
        if (!Array.isArray(snapshot)) return;
        snapshot.forEach(item => {
            const sym = item.symbol;
            const priceEl = document.querySelector(`[data-price="${sym}"]`);
            const changeEl = document.querySelector(`[data-change="${sym}"]`);
            if (priceEl && item.price != null) {
                priceEl.textContent = '$' + Number(item.price).toFixed(2);
                // Flash effect
                priceEl.classList.add('price-flash');
                setTimeout(() => priceEl.classList.remove('price-flash'), 600);
            }
            if (changeEl && item.change_pct != null) {
                const v = Number(item.change_pct);
                const sign = v > 0 ? '+' : '';
                changeEl.textContent = sign + v.toFixed(2) + '%';
                changeEl.className = 'stock-change ' + (v >= 0 ? 'text-green' : 'text-red');
            }
            // Update freshness badge via SSE ts
            if (item.ts) {
                const card = document.querySelector(`.stock-card[data-symbol="${sym}"]`);
                if (card) {
                    const fb = card.querySelector('.freshness-badge');
                    if (fb) {
                        fb.dataset.ts = item.ts;
                        fb.textContent = timeAgo(item.ts);
                        fb.className = 'freshness-badge ' + freshnessClass(item.ts);
                    }
                }
            }
        });
    }

    function connectSSE() {
        if (sseConnection) { sseConnection.close(); sseConnection = null; }
        clearTimeout(sseRetryTimer);

        try {
            sseConnection = new EventSource('/api/stream/tickers');
            sseConnection.onmessage = (e) => {
                try {
                    const snapshot = JSON.parse(e.data);
                    updateSSEPrices(snapshot);
                } catch (err) { console.debug('SSE parse error', err); }
            };
            sseConnection.onerror = () => {
                console.warn('SSE connection lost, will reconnect in 30s');
                sseConnection.close();
                sseConnection = null;
                sseRetryTimer = setTimeout(connectSSE, 30000);
            };
        } catch (err) {
            console.warn('SSE connect failed, falling back to polling', err);
        }
    }

    function startPolling() {
        // Full structural refresh (new tickers, removed tickers, mini-charts)
        // at lower frequency — SSE handles live price updates
        if (pollTimer) clearInterval(pollTimer);
        // Structural refresh every 5 min (SSE handles price updates in between)
        const structuralInterval = Math.max(pollInterval, 300);
        pollTimer = setInterval(loadStocks, structuralInterval * 1000);
        // Connect SSE for live prices
        connectSSE();
    }

    refreshPolling().then(startPolling);
    // Re-check interval every 5 min (so we cross from off-hours to market open etc.)
    setInterval(refreshPolling, 5 * 60 * 1000);

    // ── Search autocomplete ──────────────────────────────────────
    let searchDebounce = null;
    let previewDebounce = null;
    const inputSymbol = document.getElementById('input-symbol');
    const suggestBox = document.getElementById('search-suggestions');
    const previewBox = document.getElementById('add-preview');

    inputSymbol.addEventListener('input', (e) => {
        const q = e.target.value.trim();
        clearTimeout(searchDebounce);
        clearTimeout(previewDebounce);

        if (!q) {
            suggestBox.style.display = 'none';
            previewBox.style.display = 'none';
            return;
        }
        // Autocomplete suggestions
        searchDebounce = setTimeout(() => loadSuggestions(q), 200);
        // Live preview of current typed symbol
        previewDebounce = setTimeout(() => loadPreview(q), 500);
    });

    async function loadSuggestions(q) {
        try {
            const r = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
            const d = await r.json();
            const list = d.popular || [];
            if (list.length === 0) {
                suggestBox.style.display = 'none';
                return;
            }
            suggestBox.innerHTML = list.map(s => `
                <div class="suggest-item" data-sym="${s.symbol}">
                    <div class="suggest-symbol">${s.symbol}</div>
                    <div class="suggest-name">${s.name || ''}</div>
                    <div class="suggest-market">${s.market || s.exchange || 'US'}</div>
                </div>
            `).join('');
            suggestBox.style.display = 'block';
            // Click handler
            suggestBox.querySelectorAll('.suggest-item').forEach(el => {
                el.addEventListener('click', () => {
                    inputSymbol.value = el.dataset.sym;
                    suggestBox.style.display = 'none';
                    loadPreview(el.dataset.sym);
                });
            });
        } catch (e) { console.debug('search failed', e); }
    }

    async function loadPreview(sym) {
        try {
            previewBox.innerHTML = '<div class="preview-loading">載入中…</div>';
            previewBox.style.display = 'block';
            const r = await fetch('/api/tickers/preview', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({symbol: sym})
            });
            if (!r.ok) {
                previewBox.style.display = 'none';
                return;
            }
            const d = await r.json();
            const chg = d.change_pct;
            const chgClass = chg >= 0 ? 'text-green' : 'text-red';
            const sign = chg > 0 ? '+' : '';
            previewBox.innerHTML = `
                <div class="preview-card">
                    <div class="preview-row">
                        <div class="preview-name">${d.name || sym}</div>
                        <div class="preview-market">${d.market || ''}</div>
                    </div>
                    <div class="preview-row">
                        <div class="preview-price">${d.price != null ? '$' + d.price.toLocaleString() : '—'}</div>
                        <div class="${chgClass}">${chg != null ? sign + chg + '%' : ''}</div>
                    </div>
                    ${d.sector ? `<div class="preview-sector">${d.sector}</div>` : ''}
                </div>
            `;
        } catch (e) { console.debug('preview failed', e); previewBox.style.display = 'none'; }
    }

    // Re-render dynamic content when language changes
    window.addEventListener('langchange', () => {
        loadStocks();
        loadReports();
        if (currentTab === 'archived') {
            loadArchived();
        }
    });
</script>
{% endblock %}
