<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Stocker{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    
    <!-- Chart.js (zoom/crosshair handled inline — no heavy plugin needed) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/mobile.css">
    <link rel="stylesheet" href="/static/css/text-renderer.css">
    
    <!-- i18n -->
    <script src="/static/js/i18n.js"></script>
    
    <!-- Text Renderer -->
    <script src="/static/js/text-renderer.js"></script>
    
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="top-nav">
        <div class="nav-left">
            <a href="/" class="nav-logo">
                <span class="material-icons-outlined">show_chart</span>
                <span class="logo-text">Stocker</span>
            </a>
        </div>
        <div class="nav-right">
            <button class="nav-icon-btn" onclick="toggleSearch()">
                <span class="material-icons-outlined">search</span>
            </button>
            <a href="/system" class="nav-icon-btn" title="系統狀態" data-i18n-title="nav.system_title">
                <span class="material-icons-outlined">monitoring</span>
            </a>
            <a href="/alerts" class="nav-icon-btn nav-icon-btn-badged" title="價格提醒" data-i18n-title="alerts.title">
                <span class="material-icons-outlined">notifications_active</span>
                <span id="alerts-nav-badge" class="nav-badge" style="display:none;" aria-label="enabled alerts count">0</span>
            </a>
            <div class="lang-switcher">
                <button class="lang-btn ${_lang === 'zh' ? 'active' : ''}" data-lang="zh" onclick="setLang('zh')">中</button>
                <button class="lang-btn ${_lang === 'en' ? 'active' : ''}" data-lang="en" onclick="setLang('en')">EN</button>
            </div>
        </div>
    </nav>

    <!-- Search Bar (hidden by default) -->
    <div id="search-bar" class="search-bar" style="display:none;">
        <div class="search-input-wrapper">
            <span class="material-icons-outlined">search</span>
            <input type="text" id="search-input" data-i18n-placeholder="nav.search_placeholder" placeholder="搜尋股票代碼...">
            <button class="search-close" onclick="toggleSearch()">
                <span class="material-icons-outlined">close</span>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Bottom Tab Bar -->
    <nav class="bottom-nav">
        <a href="/" class="bottom-nav-item {% if request.path == '/' %}active{% endif %}">
            <span class="material-icons-outlined">dashboard</span>
            <span data-i18n="nav.dashboard">主頁</span>
        </a>
        <a href="/industry" class="bottom-nav-item {% if request.path == '/industry' %}active{% endif %}">
            <span class="material-icons-outlined">business</span>
            <span data-i18n="nav.industry">行業</span>
        </a>
        <a href="/banks" class="bottom-nav-item {% if request.path == '/banks' %}active{% endif %}">
            <span class="material-icons-outlined">account_balance</span>
            <span data-i18n="nav.banks">投行</span>
        </a>
        <a href="/sources" class="bottom-nav-item {% if request.path == '/sources' %}active{% endif %}">
            <span class="material-icons-outlined">cloud</span>
            <span data-i18n="nav.sources">數據源</span>
        </a>
        <a href="/watchlists" class="bottom-nav-item {% if request.path == '/watchlists' %}active{% endif %}">
            <span class="material-icons-outlined">bookmark</span>
            <span data-i18n="nav.watchlists">分組</span>
        </a>
        <a href="/events" class="bottom-nav-item {% if request.path == '/events' %}active{% endif %}">
            <span class="material-icons-outlined">calendar_month</span>
            <span data-i18n="nav.calendar">日曆</span>
        </a>
        <a href="/files" class="bottom-nav-item {% if request.path == '/files' %}active{% endif %}">
            <span class="material-icons-outlined">folder</span>
            <span data-i18n="nav.files">檔案</span>
        </a>
    </nav>

    <!-- Floating Action Button (FAB) — visible on dashboard only, opens Add Ticker modal -->
    {% if request.path == '/' %}
    <button class="fab" onclick="openAddModal()" aria-label="新增股票" data-i18n-aria="index.add">
        <span class="material-icons-outlined">add</span>
    </button>
    {% endif %}

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display:none;">
        <div class="spinner"></div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script>
        // Search toggle
        function toggleSearch() {
            const searchBar = document.getElementById('search-bar');
            const searchInput = document.getElementById('search-input');
            if (searchBar.style.display === 'none') {
                searchBar.style.display = 'flex';
                searchInput.focus();
            } else {
                searchBar.style.display = 'none';
                searchInput.value = '';
            }
        }

        // Loading
        function showLoading() {
            document.getElementById('loading-overlay').style.display = 'flex';
        }
        function hideLoading() {
            document.getElementById('loading-overlay').style.display = 'none';
        }

        // Toast notification
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            
            const icons = {
                'info': 'info',
                'success': 'check_circle',
                'error': 'error',
                'warning': 'warning'
            };
            
            toast.innerHTML = `
                <span class="material-icons-outlined">${icons[type] || 'info'}</span>
                <span class="toast-message">${message}</span>
            `;
            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.add('show');
            });
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Apply translations on load
        document.addEventListener('DOMContentLoaded', () => {
            applyTranslations();
            refreshAlertsBadge();
        });

        // Refresh the top-nav alerts badge with the current enabled-alerts count.
        // Fires on DOMContentLoaded + every langchange (badge text is a number,
        // but the fetch re-runs so the count stays current across SPA navigations).
        async function refreshAlertsBadge() {
            const badge = document.getElementById('alerts-nav-badge');
            if (!badge) return;
            try {
                const res = await fetch('/api/alerts?enabled=1');
                if (!res.ok) return;
                const alerts = await res.json();
                const n = Array.isArray(alerts) ? alerts.length : 0;
                if (n > 0) {
                    badge.textContent = n > 99 ? '99+' : String(n);
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none';
                }
            } catch (err) {
                // Silent — the icon is fine without a count
            }
        }
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
